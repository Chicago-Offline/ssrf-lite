  </defs>
  <!-- signal arcs -->
  <path d="M56 14 A16 16 0 0 1 72 30" fill="none" stroke="#4fb3ff" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <path d="M60 4 A26 26 0 0 1 82 26" fill="none" stroke="#4fb3ff" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
