# ssrf/_taxonomies/dcs_codes.yaml
version: 2026-09-17

# The standard 104-code DCS / CDCSS set.
#
# DCS codes are three-digit OCTAL values. They are stored as quoted strings for
# two reasons:
#
#   1. An integer is ambiguous. As a DCS code, 624 means octal 624 (= 404
#      decimal); as a YAML integer it means decimal 624. Nothing in the value
#      itself says which, so consumers cannot round-trip it safely.
#   2. YAML 1.1 (what PyYAML implements) reads an unquoted leading zero as
#      octal, so a bare `032` silently loads as the integer 26.
#
# Polarity (normal vs inverted) is NOT part of the code -- it lives in the
# separate `dcs_tx_polarity` / `dcs_rx_polarity` fields.
#
# Codes outside this list are rejected. If a radio or licence genuinely uses a
# non-standard code, add it here deliberately rather than loosening the type.

