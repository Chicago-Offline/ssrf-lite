# Humboldt County, CA amateur repeaters along the US-101 Redwood Coast leg.
# Transcribed from the Humboldt Amateur Radio Club's own published repeater page.
# Offsets and CTCSS tones are as published by the club.
# Off-route Trinity County and Del Norte entries from the same page are filed
# under their own counties or omitted.

