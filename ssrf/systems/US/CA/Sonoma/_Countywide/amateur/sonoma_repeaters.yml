$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Marin Amateur Radio Society - Frequency List"
      url: "https://w6sg.net/site/public-service/frequency-list/"
      accessed: "2026-11-06"

# Sonoma County, CA amateur repeaters on the Hwy 1 / US-101 run south toward
# the Bay. Transcribed from the Marin Amateur Radio Society frequency list,
# which publishes the neighbouring SMRS and SCRA systems.

organizations:
  - id: org_scra
    name: "SCRA"
  - id: org_smrs
    name: "SMRS"

locations:
  - id: loc_smrs_sonomamtn
    name: "Sonoma Mountain, Sonoma County, CA (approx)"
  - id: loc_smrs_dillonbeach
    name: "Dillon Beach, Sonoma County, CA (approx)"
  - id: loc_smrs_ptreyes_145170
    name: "Point Reyes, Sonoma County, CA (approx)"
  - id: loc_smrs_ptreyes_145470
    name: "Point Reyes, Sonoma County, CA (approx)"
  - id: loc_scra_englishhill
    name: "English Hill (Sebastopol), Sonoma County, CA (approx)"
  - id: loc_scra_cathedralhill
    name: "Cathedral Hill, Sonoma County, CA (approx)"

stations:
  - id: stn_smrs_sonomamtn
    call_sign: "WB6TMS"
    organization_id: org_smrs
    location_id: loc_smrs_sonomamtn
    service: "amateur"
  - id: stn_smrs_dillonbeach
    call_sign: "KI6SUD"
    organization_id: org_smrs
    location_id: loc_smrs_dillonbeach
    service: "amateur"
  - id: stn_smrs_ptreyes_145170
    call_sign: "WB6TMS"
    organization_id: org_smrs
    location_id: loc_smrs_ptreyes_145170
    service: "amateur"
  - id: stn_smrs_ptreyes_145470
    call_sign: "WB6TMS"
    organization_id: org_smrs
    location_id: loc_smrs_ptreyes_145470
    service: "amateur"
  - id: stn_scra_englishhill
    call_sign: "W6SON"
    organization_id: org_scra
    location_id: loc_scra_englishhill
    service: "amateur"
  - id: stn_scra_cathedralhill
    call_sign: "W6SON"
    organization_id: org_scra
    location_id: loc_scra_cathedralhill
    service: "amateur"

rf_chains:
  - id: chain_smrs_sonomamtn
    station_id: stn_smrs_sonomamtn
    tx:
      freq_mhz: 146.9100
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 146.3100
    mode:
      type: "FM"
      ctcss_tx_hz: 88.5
      ctcss_rx_hz: 88.5
  - id: chain_smrs_dillonbeach
    station_id: stn_smrs_dillonbeach
    tx:
      freq_mhz: 146.8650
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 146.2650
    mode:
      type: "FM"
      ctcss_tx_hz: 88.5
      ctcss_rx_hz: 88.5
  - id: chain_smrs_ptreyes_145170
    station_id: stn_smrs_ptreyes_145170
    tx:
      freq_mhz: 145.1700
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 144.5700
    mode:
      type: "FM"
      ctcss_tx_hz: 88.5
