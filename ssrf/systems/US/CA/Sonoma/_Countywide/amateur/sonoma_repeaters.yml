    short_name: "SNM910"
    channel_name: "WB6TMS 146.910"
    rf_chain_id: chain_smrs_sonomamtn
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      Sonoma Mountain Repeater Society, linked.
    verified:
      date: "2026-11-06"
      method: "published"
      by: "KC9MHE"
      note: "Club-published listing only. Not monitored on air."
