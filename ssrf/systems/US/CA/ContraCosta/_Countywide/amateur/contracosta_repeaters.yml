$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Marin Amateur Radio Society - Frequency List"
      url: "https://w6sg.net/site/public-service/frequency-list/"
      accessed: "2026-11-06"

# Contra Costa County, CA amateur repeaters - the Danville end of the drive.
# Transcribed from the Marin Amateur Radio Society frequency list, which
# publishes the CCRA and 4Cs systems.

organizations:
  - id: org_4cs
    name: "4CS"
  - id: org_ccra
    name: "CCRA"

locations:
  - id: loc_ccra_kregor
    name: "Kregor Peak (Clayton), Contra Costa County, CA (approx)"
  - id: loc_ccra_baldpeak
    name: "Bald Peak (Orinda), Contra Costa County, CA (approx)"
  - id: loc_ccra_highland
    name: "Highland Peak (San Ramon), Contra Costa County, CA (approx)"
  - id: loc_fourcs_145110
    name: "Sobrante Ridge (El Sobrante), Contra Costa County, CA (approx)"
  - id: loc_fourcs_224300
    name: "Sobrante Ridge (El Sobrante), Contra Costa County, CA (approx)"
  - id: loc_fourcs_444275
    name: "El Sobrante, Contra Costa County, CA (approx)"

stations:
  - id: stn_ccra_kregor
    call_sign: "WA6HAM"
    organization_id: org_ccra
    location_id: loc_ccra_kregor
    service: "amateur"
  - id: stn_ccra_baldpeak
    call_sign: "WA6HAM"
    organization_id: org_ccra
    location_id: loc_ccra_baldpeak
    service: "amateur"
  - id: stn_ccra_highland
    call_sign: "WA6HAM"
    organization_id: org_ccra
    location_id: loc_ccra_highland
    service: "amateur"
  - id: stn_fourcs_145110
    call_sign: "WA6KQB"
    organization_id: org_4cs
    location_id: loc_fourcs_145110
    service: "amateur"
  - id: stn_fourcs_224300
    call_sign: "WA6KQB"
    organization_id: org_4cs
    location_id: loc_fourcs_224300
    service: "amateur"
  - id: stn_fourcs_444275
    call_sign: "WA6KQB"
    organization_id: org_4cs
    location_id: loc_fourcs_444275
    service: "amateur"

rf_chains:
