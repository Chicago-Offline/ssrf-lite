    station_id: stn_ccra_kregor
    tx:
      freq_mhz: 147.7350
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 147.1350
    mode:
      type: "FM"
      ctcss_tx_hz: 107.2
      ctcss_rx_hz: 107.2
  - id: chain_ccra_baldpeak
    station_id: stn_ccra_baldpeak
