      bandwidth_khz: 25
    rx:
      freq_mhz: 144.8900
    mode:
      type: "FM"
      ctcss_tx_hz: 107.2
      ctcss_rx_hz: 107.2
  - id: chain_ccra_highland
    station_id: stn_ccra_highland
    tx:
      freq_mhz: 145.4100
      emission: "16K0F3E"
      bandwidth_khz: 25
