$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Marin Amateur Radio Society - Frequency List"
      url: "https://w6sg.net/site/public-service/frequency-list/"
      accessed: "2026-11-06"

# Marin County, CA amateur repeaters - the Hwy 1 / Muir Woods approach to the
# Golden Gate. Transcribed from the Marin Amateur Radio Society frequency list.
# The four 146.700 entries are one linked simulcast system differentiated only
# by CTCSS tone per site; program all four if you are moving through the county.

organizations:
  - id: org_marinaecu
    name: "MARINAECU"
  - id: org_mars
    name: "MARS"

locations:
  - id: loc_mars_bahia
    name: "Bahia Ridge (Novato), Marin County, CA (approx)"
  - id: loc_mars_tam_mid
    name: "Mount Tamalpais (Middle Peak), Marin County, CA (approx)"
