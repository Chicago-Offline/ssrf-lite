# Lincoln County, OR amateur repeaters - Depoe Bay, Newport and Yachats on US-101.
# Transcribed from the Lincoln County Amateur Radio Club's own repeater page.
# DATA GAP: the club page publishes frequencies but NOT offsets or CTCSS tones
# for the VHF machines. Offsets here are derived from the ARRL 2m band plan
# (145.x = -600 kHz, 147.0-147.4 = +600 kHz) and are NOT club-published.
# CTCSS is omitted rather than guessed - several of these are carrier access,
# but that is unconfirmed. Verify on air or obtain the county frequency PDF
# before trusting these for emergency traffic. 443.750 tone IS club-published.

