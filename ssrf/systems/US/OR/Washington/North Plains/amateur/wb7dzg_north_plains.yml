# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# North Plains, Washington County, OR - WB7DZG, sponsored by WORC.
# ORRC publishes the pair but no tone and sets no tone-required flag, so this is
# recorded carrier-access.

organizations:
  - id: org_worc_np
    name: "WORC"

locations:
  - id: loc_dzg450
    name: "North Plains, Washington County, OR"

stations:
  - id: stn_dzg450
    call_sign: "WB7DZG"
    organization_id: org_worc_np
    location_id: loc_dzg450
    service: "amateur"

rf_chains:
  - id: chain_dzg450
    station_id: stn_dzg450
    tx:
      freq_mhz: 145.4500
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 144.8500
    mode:
      type: "FM"

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_dzg450
    short_name: "NPL450"
    channel_name: "WB7DZG North Plains 145.450"
    rf_chain_id: chain_dzg450
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      No CTCSS published by the coordinator.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
