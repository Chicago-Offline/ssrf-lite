# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Tigard, Washington County, OR - K7ICY. ORRC-coordinated pair and tone.

organizations:
  - id: org_k7icy
    name: "K7ICY"

locations:
  - id: loc_icy440
    name: "Tigard, Washington County, OR"

stations:
  - id: stn_icy440
    call_sign: "K7ICY"
    organization_id: org_k7icy
    location_id: loc_icy440
    service: "amateur"

rf_chains:
  - id: chain_icy440
    station_id: stn_icy440
    tx:
      freq_mhz: 440.1000
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 445.1000
    mode:
      type: "FM"
      ctcss_rx_hz: 162.2

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_icy440
    short_name: "TIG440"
    channel_name: "K7ICY Tigard 440.100"
    rf_chain_id: chain_icy440
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
