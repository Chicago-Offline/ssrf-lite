# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Washington County, OR - KJ7IY, sponsored by WORC. Timber and Sherwood sites.
# All three pairs and the 107.2 Hz tone are published ORRC coordinations; ORRC
# prints the Sherwood tone without parentheses ("oet107.2awxlrs") but it is the
# same 107.2 Hz used on the other two WORC machines.

organizations:
  - id: org_worc
    name: "WORC"

locations:
  - id: loc_iy270
    name: "Timber, Washington County, OR"
  - id: loc_iy441
    name: "Timber, Washington County, OR"
  - id: loc_iy442
    name: "Sherwood, Washington County, OR"

stations:
  - id: stn_iy270
    call_sign: "KJ7IY"
    organization_id: org_worc
    location_id: loc_iy270
    service: "amateur"
  - id: stn_iy441
    call_sign: "KJ7IY"
    organization_id: org_worc
    location_id: loc_iy441
    service: "amateur"
  - id: stn_iy442
    call_sign: "KJ7IY"
    organization_id: org_worc
    location_id: loc_iy442
    service: "amateur"

rf_chains:
  - id: chain_iy270
    station_id: stn_iy270
    tx:
      freq_mhz: 145.2700
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 144.6700
    mode:
      type: "FM"
      ctcss_rx_hz: 107.2
  - id: chain_iy441
    station_id: stn_iy441
    tx:
      freq_mhz: 441.8250
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 446.8250
    mode:
      type: "FM"
      ctcss_rx_hz: 107.2
  - id: chain_iy442
    station_id: stn_iy442
    tx:
      freq_mhz: 442.2750
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 447.2750
    mode:
      type: "FM"
      ctcss_rx_hz: 107.2

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_iy270
    short_name: "TMB270"
    channel_name: "KJ7IY Timber 145.270"
    rf_chain_id: chain_iy270
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      Autopatch, linked, weather per ORRC flags.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
  - id: asgn_iy441
    short_name: "TMB441"
    channel_name: "KJ7IY Timber 441.825"
    rf_chain_id: chain_iy441
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      Autopatch, linked, weather per ORRC flags.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
  - id: asgn_iy442
    short_name: "SHW442"
    channel_name: "KJ7IY Sherwood 442.275"
    rf_chain_id: chain_iy442
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      Autopatch, linked, weather per ORRC flags.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
