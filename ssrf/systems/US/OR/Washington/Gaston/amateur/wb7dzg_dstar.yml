# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Gaston, Washington County, OR - WB7DZG, sponsored by WORC. ORRC flags this
# coordination "(dstar)", so it is recorded as a D-STAR voice repeater. D-STAR
# carries no CTCSS and none is published.

organizations:
  - id: org_worc_gaston
    name: "WORC"

locations:
  - id: loc_dzg620
    name: "Gaston, Washington County, OR"

stations:
  - id: stn_dzg620
    call_sign: "WB7DZG"
    organization_id: org_worc_gaston
    location_id: loc_dzg620
    service: "amateur"

rf_chains:
  - id: chain_dzg620
    station_id: stn_dzg620
    tx:
      freq_mhz: 146.6200
      emission: "6K00F7E"
      bandwidth_khz: 12.5
    rx:
      freq_mhz: 146.0200
    mode:
      type: "D-STAR"

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_dzg620
    short_name: "GAS620"
    channel_name: "WB7DZG Gaston 146.620"
    rf_chain_id: chain_dzg620
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      D-STAR digital voice. No CTCSS (not applicable).
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
