# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Forest Grove, Washington County, OR - Amateur Radio Relay Group (K7RPT).
# ORRC-coordinated pair; ORRC prints the tone as "100", recorded as 100.0 Hz.
# Closed autopatch per the coordination flags.

organizations:
  - id: org_arrg_fg
    name: "Amateur Radio Relay Group (ARRG)"

locations:
  - id: loc_rpt320
    name: "Forest Grove, Washington County, OR"

stations:
  - id: stn_rpt320
    call_sign: "K7RPT"
    organization_id: org_arrg_fg
    location_id: loc_rpt320
    service: "amateur"

rf_chains:
  - id: chain_rpt320
    station_id: stn_rpt320
    tx:
      freq_mhz: 147.3200
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 147.9200
    mode:
      type: "FM"
      ctcss_rx_hz: 100.0

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_rpt320
    short_name: "FGR320"
    channel_name: "K7RPT Forest Grove 147.320"
    rf_chain_id: chain_rpt320
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      Closed autopatch per ORRC flags.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
