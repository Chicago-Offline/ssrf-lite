ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Sunset Empire Amateur Radio Club (W7BU) - Clatsop County UHF/VHF Band Plan"
      url: "https://w7buhams.club/clatsop-county-uhf-vhf-band-plan/"
      accessed: "2026-11-07"
    - name: "Sunset Empire Amateur Radio Club (W7BU) - SEARC Radio Network"
      url: "https://w7buhams.club/searc-radio-network/"
      accessed: "2026-11-07"
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Clatsop County, OR - Sunset Empire Amateur Radio Club (SEARC, W7BU) network.
# US-101 north coast: Arch Cape, Cannon Beach, Gearhart, Astoria (Nicolai / Wickiup).
# Frequencies, offsets AND CTCSS all come from SEARC's own published Clatsop County
# UHF/VHF band plan (a shared AuxComm channel list), cross-checked against ORRC
# published coordinations where a coordination exists. NOTHING here is derived -
# every offset is published by the club. Access tone is 118.8 Hz system-wide.
# The band plan is written radio-centric ("as if programmed in a portable"); its
# "TX Tone" column is the tone the user transmits, i.e. the tone the repeater
# demands on its input, so it is recorded here as ctcss_rx_hz per the 0.9.0+
# station-centric convention.
# NOT INCLUDED: the SEARC Megler Mountain hub (145.450) and Megler UHF Fusion
# (440.925). ORRC coordinates both to "Astoria" but SEARC's own band plan places
# the site at Megler, which is across the Columbia in Pacific County, WASHINGTON.
# Out of scope for an Oregon county file rather than filed to the wrong state.

