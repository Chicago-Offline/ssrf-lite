# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Florence, Lane County, OR - W7OC, the South-Western Oregon Repeater
# Association (SWORA) linked system. Pair and tone published by ORRC.
# SWORA runs a common 146.2 Hz access tone across its coastal machines, which is
# consistent with the Reedsport, Scottsburg, Coos Bay and Myrtle Point entries.

organizations:
  - id: org_swora_lane
    name: "South-Western Oregon Repeater Association (SWORA)"

locations:
  - id: loc_oc100
    name: "Florence, Lane County, OR"

stations:
  - id: stn_oc100
    call_sign: "W7OC"
    organization_id: org_swora_lane
    location_id: loc_oc100
    service: "amateur"

rf_chains:
  - id: chain_oc100
    station_id: stn_oc100
    tx:
      freq_mhz: 147.1000
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 147.7000
    mode:
      type: "FM"
      ctcss_rx_hz: 146.2

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_oc100
    short_name: "SWO100"
    channel_name: "W7OC Florence 147.100"
    rf_chain_id: chain_oc100
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      SWORA linked coastal system.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
