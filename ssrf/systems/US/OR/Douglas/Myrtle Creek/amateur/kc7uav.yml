# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Myrtle Creek, Douglas County, OR - KC7UAV. ORRC-coordinated pair; ORRC prints
# the tone as "100.0".

organizations:
  - id: org_kc7uav
    name: "KC7UAV"

locations:
  - id: loc_uav120
    name: "Myrtle Creek, Douglas County, OR"

stations:
  - id: stn_uav120
    call_sign: "KC7UAV"
    organization_id: org_kc7uav
    location_id: loc_uav120
    service: "amateur"

rf_chains:
  - id: chain_uav120
    station_id: stn_uav120
    tx:
      freq_mhz: 147.1200
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 147.7200
    mode:
      type: "FM"
      ctcss_rx_hz: 100.0

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_uav120
    short_name: "MYC120"
    channel_name: "KC7UAV Myrtle Creek 147.120"
    rf_chain_id: chain_uav120
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
