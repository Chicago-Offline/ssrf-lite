# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Douglas County, OR - WB7RKR. Roseburg 1.25m machine plus two Glide sites.
# All pairs and tones published by ORRC. These are inland (I-5 / North Umpqua),
# not on the US-101 coast route.

organizations:
  - id: org_wb7rkr
    name: "WB7RKR"

locations:
  - id: loc_rkr224
    name: "Roseburg, Douglas County, OR"
  - id: loc_rkr430
    name: "Glide, Douglas County, OR"
  - id: loc_rkr240
    name: "Glide, Douglas County, OR"

stations:
  - id: stn_rkr224
    call_sign: "WB7RKR"
    organization_id: org_wb7rkr
    location_id: loc_rkr224
    service: "amateur"
  - id: stn_rkr430
    call_sign: "WB7RKR"
    organization_id: org_wb7rkr
    location_id: loc_rkr430
    service: "amateur"
  - id: stn_rkr240
    call_sign: "WB7RKR"
    organization_id: org_wb7rkr
    location_id: loc_rkr240
    service: "amateur"

rf_chains:
  - id: chain_rkr224
    station_id: stn_rkr224
    tx:
      freq_mhz: 224.1000
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 222.5000
    mode:
      type: "FM"
      ctcss_rx_hz: 114.8
  - id: chain_rkr430
    station_id: stn_rkr430
    tx:
      freq_mhz: 145.4300
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 144.8300
    mode:
      type: "FM"
      ctcss_rx_hz: 88.5
  - id: chain_rkr240
    station_id: stn_rkr240
    tx:
      freq_mhz: 147.2400
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 147.8400
    mode:
      type: "FM"
      ctcss_rx_hz: 136.5

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_rkr224
    short_name: "RBG224"
    channel_name: "WB7RKR Roseburg 224.100"
    rf_chain_id: chain_rkr224
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      1.25m band.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
  - id: asgn_rkr430
    short_name: "GLD430"
    channel_name: "WB7RKR Glide 145.430"
    rf_chain_id: chain_rkr430
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
  - id: asgn_rkr240
    short_name: "GLD240"
    channel_name: "WB7RKR Glide 147.240"
    rf_chain_id: chain_rkr240
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
