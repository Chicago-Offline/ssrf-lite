# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Coquille, Coos County, OR - K7CCH, sponsored by CCRC per ORRC.
# Pair and tone published.

organizations:
  - id: org_ccrc
    name: "CCRC"

locations:
  - id: loc_cch610
    name: "Coquille, Coos County, OR"

stations:
  - id: stn_cch610
    call_sign: "K7CCH"
    organization_id: org_ccrc
    location_id: loc_cch610
    service: "amateur"

rf_chains:
  - id: chain_cch610
    station_id: stn_cch610
    tx:
      freq_mhz: 146.6100
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 146.0100
    mode:
      type: "FM"
      ctcss_rx_hz: 110.9

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_cch610
    short_name: "COQ610"
    channel_name: "K7CCH Coquille 146.610"
    rf_chain_id: chain_cch610
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
