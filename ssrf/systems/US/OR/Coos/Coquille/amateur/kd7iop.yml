# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Coquille, Coos County, OR - KD7IOP (licensee WA7JAW per ORRC).
# Pair and tone published.

organizations:
  - id: org_kd7iop
    name: "KD7IOP"

locations:
  - id: loc_iop640
    name: "Coquille, Coos County, OR"

stations:
  - id: stn_iop640
    call_sign: "KD7IOP"
    organization_id: org_kd7iop
    location_id: loc_iop640
    service: "amateur"

rf_chains:
  - id: chain_iop640
    station_id: stn_iop640
    tx:
      freq_mhz: 146.6400
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 146.0400
    mode:
      type: "FM"
      ctcss_rx_hz: 88.5

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_iop640
    short_name: "COQ640"
    channel_name: "KD7IOP Coquille 146.640"
    rf_chain_id: chain_iop640
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
