# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Coos Bay, Coos County, OR - WA7JAW. ORRC-coordinated pair and tone.

organizations:
  - id: org_wa7jaw_coos
    name: "WA7JAW"

locations:
  - id: loc_jawc440
    name: "Coos Bay, Coos County, OR"

stations:
  - id: stn_jawc440
    call_sign: "WA7JAW"
    organization_id: org_wa7jaw_coos
    location_id: loc_jawc440
    service: "amateur"

rf_chains:
  - id: chain_jawc440
    station_id: stn_jawc440
    tx:
      freq_mhz: 440.8000
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 445.8000
    mode:
      type: "FM"
      ctcss_rx_hz: 103.5

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_jawc440
    short_name: "CBY440"
    channel_name: "WA7JAW Coos Bay 440.800"
    rf_chain_id: chain_jawc440
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
