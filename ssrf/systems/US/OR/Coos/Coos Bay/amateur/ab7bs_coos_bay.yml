# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Coos Bay, Coos County, OR - AB7BS linked group. ORRC publishes the pair and
# prints the access code as "(023)", recorded as DCS 023 consistent with the same
# group's DCS usage in Portland and Glide.

organizations:
  - id: org_ab7bs_coos
    name: "AB7BS"

locations:
  - id: loc_bsc880
    name: "Coos Bay, Coos County, OR"

stations:
  - id: stn_bsc880
    call_sign: "AB7BS"
    organization_id: org_ab7bs_coos
    location_id: loc_bsc880
    service: "amateur"

rf_chains:
  - id: chain_bsc880
    station_id: stn_bsc880
    tx:
      freq_mhz: 146.8800
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 146.2800
    mode:
      type: "FM"
      dcs_rx_code: "023"

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_bsc880
    short_name: "CBY880"
    channel_name: "AB7BS Coos Bay 146.880"
    rf_chain_id: chain_bsc880
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      Linked system. DCS access.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
