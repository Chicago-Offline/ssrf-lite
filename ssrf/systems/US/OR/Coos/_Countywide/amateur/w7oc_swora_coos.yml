# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Coos County, OR - W7OC / SWORA. Coos Bay and Myrtle Point. All pairs and tones
# published by ORRC. Note 441.725 uses 131.8 Hz, NOT the 146.2 Hz shared by the
# rest of the SWORA coastal system.
# COVERAGE GAP: no coordinated amateur repeater is published for BANDON. ORRC has
# no Bandon entry and no club page for Bandon was found. Nearest published
# coverage is Coquille and Coos Bay.

organizations:
  - id: org_swora_coos
    name: "South-Western Oregon Repeater Association (SWORA)"

locations:
  - id: loc_oc280
    name: "Coos Bay, Coos County, OR"
  - id: loc_oc441
    name: "Coos Bay, Coos County, OR"
  - id: loc_oc190
    name: "Myrtle Point, Coos County, OR"

stations:
  - id: stn_oc280
    call_sign: "W7OC"
    organization_id: org_swora_coos
    location_id: loc_oc280
    service: "amateur"
  - id: stn_oc441
    call_sign: "W7OC"
    organization_id: org_swora_coos
    location_id: loc_oc441
    service: "amateur"
  - id: stn_oc190
    call_sign: "W7OC"
    organization_id: org_swora_coos
    location_id: loc_oc190
    service: "amateur"

rf_chains:
  - id: chain_oc280
    station_id: stn_oc280
    tx:
      freq_mhz: 147.2800
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 147.8800
    mode:
      type: "FM"
      ctcss_rx_hz: 146.2
  - id: chain_oc441
    station_id: stn_oc441
    tx:
      freq_mhz: 441.7250
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 446.7250
    mode:
      type: "FM"
      ctcss_rx_hz: 131.8
  - id: chain_oc190
    station_id: stn_oc190
    tx:
      freq_mhz: 145.1900
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 144.5900
    mode:
      type: "FM"
      ctcss_rx_hz: 146.2

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_oc280
    short_name: "CBY280"
    channel_name: "W7OC Coos Bay 147.280"
    rf_chain_id: chain_oc280
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      SWORA linked coastal system.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
  - id: asgn_oc441
    short_name: "CBY441"
    channel_name: "W7OC Coos Bay 441.725"
    rf_chain_id: chain_oc441
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      Different access tone from the rest of the SWORA coastal system.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
  - id: asgn_oc190
    short_name: "MYP190"
    channel_name: "W7OC Myrtle Point 145.190"
    rf_chain_id: chain_oc190
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      SWORA linked system.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
