# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Tillamook, Tillamook County, OR - KB7EOC. ORRC-coordinated, solar and wind
# emergency power flagged. ORRC prints the tone as "77", recorded here as the
# standard 77.0 Hz CTCSS.

organizations:
  - id: org_kb7eoc
    name: "KB7EOC"

locations:
  - id: loc_eoc440
    name: "Tillamook, Tillamook County, OR"

stations:
  - id: stn_eoc440
    call_sign: "KB7EOC"
    organization_id: org_kb7eoc
    location_id: loc_eoc440
    service: "amateur"

rf_chains:
  - id: chain_eoc440
    station_id: stn_eoc440
    tx:
      freq_mhz: 440.5250
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 445.5250
    mode:
      type: "FM"
      ctcss_rx_hz: 77.0

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_eoc440
    short_name: "TIL440"
    channel_name: "KB7EOC Tillamook 440.525"
    rf_chain_id: chain_eoc440
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      Solar/wind powered site per ORRC flags.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
