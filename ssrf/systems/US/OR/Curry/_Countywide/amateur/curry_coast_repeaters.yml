    channel_name: "W7BKG 146.960"
    rf_chain_id: chain_pbarc_brookings
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      Pelican Bay ARC.
    verified:
      date: "2026-11-06"
      method: "published"
      by: "KC9MHE"
      note: "Club-published listing only. Not monitored on air."
