$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Pelican Bay Amateur Radio Club + Del Norte ARC published Curry County list"
      url: "https://w7bkg.org/wiki/Home_Page"
      accessed: "2026-11-06"

# Curry County, OR amateur repeaters - Brookings, Gold Beach and Port Orford, US-101.
# Pelican Bay ARC data from the club's own wiki; the wider Curry County list is
# cross-published by the Del Norte ARC just across the state line.

organizations:
  - id: org_pbarc
    name: "PBARC"
  - id: org_portorfordhams
    name: "PORTORFORDHAMS"

locations:
  - id: loc_pbarc_brookings
    name: "Brookings, Curry County, OR (approx)"
  - id: loc_pbarc_crownterrace
    name: "Crown Terrace, Brookings, Curry County, OR (approx)"
  - id: loc_pbarc_bosley
    name: "Bosley Butte, Curry County, OR (approx)"
  - id: loc_curry_grizzly
    name: "Grizzly Mountain, Gold Beach, Curry County, OR (approx)"
  - id: loc_pofh_200
    name: "Port Orford, Curry County, OR (approx)"
  - id: loc_pofh_440
    name: "Port Orford, Curry County, OR (approx)"

stations:
  - id: stn_pbarc_brookings
    call_sign: "W7BKG"
    organization_id: org_pbarc
    location_id: loc_pbarc_brookings
    service: "amateur"
  - id: stn_pbarc_crownterrace
    call_sign: "W7BKG"
    organization_id: org_pbarc
    location_id: loc_pbarc_crownterrace
    service: "amateur"
  - id: stn_pbarc_bosley
    call_sign: "W7BKG"
    organization_id: org_pbarc
    location_id: loc_pbarc_bosley
    service: "amateur"
  - id: stn_curry_grizzly
    call_sign: null
    organization_id: org_pbarc
    location_id: loc_curry_grizzly
    service: "amateur"
  - id: stn_pofh_200
    call_sign: null
    organization_id: org_portorfordhams
    location_id: loc_pofh_200
    service: "amateur"
  - id: stn_pofh_440
    call_sign: null
    organization_id: org_portorfordhams
    location_id: loc_pofh_440
    service: "amateur"

rf_chains:
  - id: chain_pbarc_brookings
    station_id: stn_pbarc_brookings
    tx:
      freq_mhz: 146.9600
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 146.3600
    mode:
      type: "FM"
      ctcss_tx_hz: 88.5
      ctcss_rx_hz: 88.5
  - id: chain_pbarc_crownterrace
    station_id: stn_pbarc_crownterrace
    tx:
      freq_mhz: 146.8400
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 146.2400
    mode:
      type: "FM"
      ctcss_tx_hz: 88.5
      ctcss_rx_hz: 88.5
  - id: chain_pbarc_bosley
    station_id: stn_pbarc_bosley
    tx:
      freq_mhz: 147.2500
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 147.8500
    mode:
      type: "FM"
      ctcss_tx_hz: 88.5
      ctcss_rx_hz: 88.5
  - id: chain_curry_grizzly
