# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Portland, Multnomah County, OR - AB7BS linked repeater group. All four pairs
# and all four access codes are published ORRC coordinations. Two use DCS rather
# than CTCSS (ORRC prints them as "D023" and "DCS125").

organizations:
  - id: org_ab7bs_pdx
    name: "AB7BS"

locations:
  - id: loc_bs310
    name: "Portland, Multnomah County, OR"
  - id: loc_bs980
    name: "Portland, Multnomah County, OR"
  - id: loc_bs440
    name: "Portland, Multnomah County, OR"
  - id: loc_bs441
    name: "Portland, Multnomah County, OR"

stations:
  - id: stn_bs310
    call_sign: "AB7BS"
    organization_id: org_ab7bs_pdx
    location_id: loc_bs310
    service: "amateur"
  - id: stn_bs980
    call_sign: "AB7BS"
    organization_id: org_ab7bs_pdx
    location_id: loc_bs980
    service: "amateur"
  - id: stn_bs440
    call_sign: "AB7BS"
    organization_id: org_ab7bs_pdx
    location_id: loc_bs440
    service: "amateur"
  - id: stn_bs441
    call_sign: "AB7BS"
    organization_id: org_ab7bs_pdx
    location_id: loc_bs441
    service: "amateur"

rf_chains:
  - id: chain_bs310
    station_id: stn_bs310
    tx:
      freq_mhz: 145.3100
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 144.7100
    mode:
      type: "FM"
      ctcss_rx_hz: 123.0
  - id: chain_bs980
    station_id: stn_bs980
    tx:
      freq_mhz: 146.9800
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 146.3800
    mode:
      type: "FM"
      dcs_rx_code: "023"
  - id: chain_bs440
    station_id: stn_bs440
    tx:
      freq_mhz: 440.5000
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 445.5000
    mode:
      type: "FM"
      dcs_rx_code: "125"
  - id: chain_bs441
    station_id: stn_bs441
    tx:
      freq_mhz: 441.3500
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 446.3500
    mode:
      type: "FM"
      dcs_rx_code: "023"

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_bs310
    short_name: "PDX310"
    channel_name: "AB7BS Portland 145.310"
    rf_chain_id: chain_bs310
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      Linked system.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
  - id: asgn_bs980
    short_name: "PDX980"
    channel_name: "AB7BS Portland 146.980"
    rf_chain_id: chain_bs980
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      Linked system. DCS access.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
  - id: asgn_bs440
    short_name: "PDX440"
    channel_name: "AB7BS Portland 440.500"
    rf_chain_id: chain_bs440
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      Linked system. DCS access.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
  - id: asgn_bs441
    short_name: "PDX441"
    channel_name: "AB7BS Portland 441.350"
    rf_chain_id: chain_bs441
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      Linked system. DCS access.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
