# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Portland, Multnomah County, OR - WB7QIW, sponsored by HARC per ORRC.
# Pair and tone both published.

organizations:
  - id: org_harc
    name: "HARC"

locations:
  - id: loc_qiw280
    name: "Portland, Multnomah County, OR"

stations:
  - id: stn_qiw280
    call_sign: "WB7QIW"
    organization_id: org_harc
    location_id: loc_qiw280
    service: "amateur"

rf_chains:
  - id: chain_qiw280
    station_id: stn_qiw280
    tx:
      freq_mhz: 147.2800
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 147.8800
    mode:
      type: "FM"
      ctcss_rx_hz: 167.9

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_qiw280
    short_name: "HAR280"
    channel_name: "WB7QIW Portland 147.280"
    rf_chain_id: chain_qiw280
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
