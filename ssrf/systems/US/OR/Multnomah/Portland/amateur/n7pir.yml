# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Portland, Multnomah County, OR - N7PIR. ORRC-coordinated pair and tone.

organizations:
  - id: org_n7pir
    name: "N7PIR"

locations:
  - id: loc_pir440
    name: "Portland, Multnomah County, OR"

stations:
  - id: stn_pir440
    call_sign: "N7PIR"
    organization_id: org_n7pir
    location_id: loc_pir440
    service: "amateur"

rf_chains:
  - id: chain_pir440
    station_id: stn_pir440
    tx:
      freq_mhz: 440.4500
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 445.4500
    mode:
      type: "FM"
      ctcss_rx_hz: 103.5

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_pir440
    short_name: "PIR440"
    channel_name: "N7PIR Portland 440.450"
    rf_chain_id: chain_pir440
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      Linked per ORRC flags.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
