# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Portland, Multnomah County, OR - Amateur Radio Relay Group (K7RPT).
# ORRC-coordinated pair and tone. ARRG's Timberline machine (147.120) is in
# Clackamas County and is deliberately not included in this file.

organizations:
  - id: org_arrg_pdx
    name: "Amateur Radio Relay Group (ARRG)"

locations:
  - id: loc_rpt442
    name: "Portland, Multnomah County, OR"

stations:
  - id: stn_rpt442
    call_sign: "K7RPT"
    organization_id: org_arrg_pdx
    location_id: loc_rpt442
    service: "amateur"

rf_chains:
  - id: chain_rpt442
    station_id: stn_rpt442
    tx:
      freq_mhz: 442.2250
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 447.2250
    mode:
      type: "FM"
      ctcss_rx_hz: 103.5

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_rpt442
    short_name: "ARG442"
    channel_name: "K7RPT Portland 442.225"
    rf_chain_id: chain_rpt442
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
