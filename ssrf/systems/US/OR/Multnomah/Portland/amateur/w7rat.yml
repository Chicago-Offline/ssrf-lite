# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Portland, Multnomah County, OR - W7RAT. ORRC-coordinated pair and tone.

organizations:
  - id: org_w7rat
    name: "W7RAT"

locations:
  - id: loc_rat440
    name: "Portland, Multnomah County, OR"

stations:
  - id: stn_rat440
    call_sign: "W7RAT"
    organization_id: org_w7rat
    location_id: loc_rat440
    service: "amateur"

rf_chains:
  - id: chain_rat440
    station_id: stn_rat440
    tx:
      freq_mhz: 440.4000
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 445.4000
    mode:
      type: "FM"
      ctcss_rx_hz: 123.0

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_rat440
    short_name: "RAT440"
    channel_name: "W7RAT Portland 440.400"
    rf_chain_id: chain_rat440
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      Linked per ORRC flags.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
