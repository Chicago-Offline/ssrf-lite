# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "Oregon Relay Radio Council (ORRC) - Published Coordinations"
      url: "https://orrc.org/Coordinations/Published"
      accessed: "2026-11-07"

# Corbett, Multnomah County, OR - N7LF, east Multnomah County in the Columbia
# River Gorge. ORRC-coordinated pair and tone.

organizations:
  - id: org_n7lf
    name: "N7LF"

locations:
  - id: loc_lf410
    name: "Corbett, Multnomah County, OR"

stations:
  - id: stn_lf410
    call_sign: "N7LF"
    organization_id: org_n7lf
    location_id: loc_lf410
    service: "amateur"

rf_chains:
  - id: chain_lf410
    station_id: stn_lf410
    tx:
      freq_mhz: 145.4100
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 144.8100
    mode:
      type: "FM"
      ctcss_rx_hz: 100.0

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_lf410
    short_name: "COR410"
    channel_name: "N7LF Corbett 145.410"
    rf_chain_id: chain_lf410
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
    notes: >-
      Linked per ORRC flags.
    verified:
      date: "2026-11-07"
      method: "published"
      by: "KC9MHE"
      note: "Club/coordinator published listing only. Not monitored on air."
