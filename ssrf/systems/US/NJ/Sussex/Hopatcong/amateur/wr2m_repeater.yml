# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "RadioReference - Sussex County, NJ Amateur Radio Repeaters"
      url: "https://www.radioreference.com/db/browse/ctid/1789/ham"
      accessed: "2026-09-27"

# WR2M - Hopatcong, NJ. 70cm repeater.
# No site coordinates published; location is a town-center approximation.

organizations:
  - id: org_wr2m
    name: "WR2M - Hopatcong 70cm repeater"

locations:
  - id: loc_hopatcong_nj
    name: "Hopatcong, NJ (approx)"
    lat: 40.934
    lon: -74.659

stations:
  - id: stn_wr2m_70cm
    call_sign: "WR2M"
    organization_id: org_wr2m
    location_id: loc_hopatcong_nj
    service: "amateur"

antennas:
  - id: ant_wr2m_70cm
    station_id: stn_wr2m_70cm
    name: "70cm Vertical"
    gain_dbi: null
    height_agl_m: null
    height_amsl_m: null

rf_chains:
  - id: chain_wr2m_448675_fm
    station_id: stn_wr2m_70cm
    antenna_id: ant_wr2m_70cm
    tx:
      freq_mhz: 448.675
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 443.675 # -5 MHz input
    mode:
      type: "FM"
      ctcss_rx_hz: 94.8
      ctcss_tx_hz: 94.8

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_wr2m_448675
    short_name: "WR2M7C"
    channel_name: "WR2M 448.675"
    rf_chain_id: chain_wr2m_448675_fm
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
