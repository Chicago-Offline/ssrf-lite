$schema: "../../../../../../_schema/ssrf-lite-0.8.0.schema.json"
ssrf_lite_version: "0.8.0"
ssrf_lite:
  sources:
    - name: "RadioReference - Sussex County, New Jersey (NJ) Scanner Frequencies"
      url: "https://www.radioreference.com/db/browse/ctid/1789"
      accessed: "2026-09-28"

comments:
  - text: "Sussex County, NJ conventional public safety, public works, volunteer EMS squads and school systems, folded into one countywide file with each municipality carried as its own location and station."
  - text: "INCOMPLETE SOURCE - repeater inputs are paywalled, not absent. The county frequency table served to anonymous users has only eight columns (Frequency, License, Type, Tone, Alpha Tag, Description, Mode, Tag). RadioReference does hold input frequencies for this county, but exposes them through a 'Show Repeater Inputs' toggle gated behind a Premium subscription (showInputs=0 for anonymous sessions). Every chain here therefore records only the published output as rx.freq_mhz and leaves tx.freq_mhz null. Type RM entries are marked usage repeater with the input recorded as unavailable at capture time rather than nonexistent. A Premium capture should revisit every RM chain and fill in tx.freq_mhz."
  - text: "The anonymous view has a single Tone column that does not distinguish input from output; the separate Tone In / Tone Out columns are part of the same Premium-gated detail. Tones are recorded as access (TX) tones only (ctcss_tx_hz / dcs_tx_code) with the output left carrier-squelch, so a radio programmed from this data cannot be silently squelched."
  - text: "OMITTED: 453.98775 MHz (Fredon Township, KVT557, alpha tag 'Fredn EMS L2', EMS Mobile Uplink). The published value is not a valid channel on any Part 90 raster and is most likely a typo for 453.9875 MHz. Left out rather than repaired - a guessed frequency is worse than a documented gap."
  - text: "SOURCE TYPO: the 155.280 MHz Blue Ridge Rescue Squad mutual-aid entry is printed with license 'KL0302' (digit zero). Every other BRRS row reads KLO302 (letter O), so it is recorded here as KLO302."
  - text: "152.9075 MHz / WQDM238 / 218.1 PL is listed under both Andover Township and Newton, and 453.9125 MHz / WPFQ901 / 141.3 PL under both the county EMS links and Sparta ('SprtaEMS MX2'). Each is one physical transmitter with two documented uses, so each is a single rf_chain with two assignments."
  - text: "Hopatcong police DMR (158.850 MHz) is noted by the source as protected by RAS. It is a frequency and identity reference only, not a listenable channel."
  - text: "No transmitter site coordinates are published for any system on this page. Every location is a municipal centroid approximation rounded to three decimals and named '(approx)'. They locate the agency, not the antenna."
  - text: "Board of Education, school and community college channels appear on this county page and are included here under service public_safety_part90 as local-government Part 90 licences."
  - text: "Several entries are published with no callsign at all: 460.6125 (SPEN 1 link), 453.5125 (county road flagmen), 154.600 (Fredon fire/EMS private), 31.680 (Lafayette DPW), 151.880 (Montague fire police), 159.030 (Ogdensburg police) and 155.205 (Hopatcong BOE buses). Their stations carry call_sign null."

