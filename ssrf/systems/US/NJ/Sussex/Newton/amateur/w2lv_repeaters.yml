# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "RadioReference - Sussex County, NJ Amateur Radio Repeaters"
      url: "https://www.radioreference.com/db/browse/ctid/1789/ham"
      accessed: "2026-09-27"

# W2LV - Newton, NJ. Five ARES/RACES repeaters, all 151.4 Hz CTCSS in and out.
# RadioReference publishes no site coordinates; location is a town-center approximation.
# NOTE: the 70cm machine is listed output 443.000 / input 448.000 - a POSITIVE 5 MHz
# split (output below input), inverted relative to the usual 70cm convention.
# Recorded exactly as published; worth a listen-test on site.

organizations:
  - id: org_w2lv
    name: "W2LV - Newton ARES/RACES"

locations:
  - id: loc_newton_nj
    name: "Newton, NJ (approx)"
    lat: 41.058
    lon: -74.753

stations:
  - id: stn_w2lv_2m
    call_sign: "W2LV"
    organization_id: org_w2lv
    location_id: loc_newton_nj
    service: "amateur"
  - id: stn_w2lv_125m
    call_sign: "W2LV"
    organization_id: org_w2lv
    location_id: loc_newton_nj
    service: "amateur"
  - id: stn_w2lv_70cm
    call_sign: "W2LV"
    organization_id: org_w2lv
    location_id: loc_newton_nj
    service: "amateur"

antennas:
  - id: ant_w2lv_2m
    station_id: stn_w2lv_2m
    name: "2m Vertical"
    gain_dbi: null
    height_agl_m: null
    height_amsl_m: null
  - id: ant_w2lv_125m
    station_id: stn_w2lv_125m
    name: "1.25m Vertical"
    gain_dbi: null
    height_agl_m: null
    height_amsl_m: null
  - id: ant_w2lv_70cm
    station_id: stn_w2lv_70cm
    name: "70cm Vertical"
    gain_dbi: null
    height_agl_m: null
    height_amsl_m: null

rf_chains:
  - id: chain_w2lv_147210_fm
    station_id: stn_w2lv_2m
    antenna_id: ant_w2lv_2m
    tx:
      freq_mhz: 147.210
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 147.810 # +600 kHz input
    mode:
      type: "FM"
      ctcss_rx_hz: 151.4
      ctcss_tx_hz: 151.4

  - id: chain_w2lv_147300_fm
    station_id: stn_w2lv_2m
    antenna_id: ant_w2lv_2m
    tx:
      freq_mhz: 147.300
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 147.900 # +600 kHz input
    mode:
      type: "FM"
      ctcss_rx_hz: 151.4
      ctcss_tx_hz: 151.4

  - id: chain_w2lv_147330_fm
    station_id: stn_w2lv_2m
    antenna_id: ant_w2lv_2m
    tx:
      freq_mhz: 147.330
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 147.930 # +600 kHz input
    mode:
      type: "FM"
      ctcss_rx_hz: 151.4
      ctcss_tx_hz: 151.4

  - id: chain_w2lv_224500_fm
    station_id: stn_w2lv_125m
    antenna_id: ant_w2lv_125m
    tx:
      freq_mhz: 224.500
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 222.900 # -1.6 MHz input
    mode:
      type: "FM"
      ctcss_rx_hz: 151.4
      ctcss_tx_hz: 151.4

  - id: chain_w2lv_443000_fm
    station_id: stn_w2lv_70cm
    antenna_id: ant_w2lv_70cm
    tx:
      freq_mhz: 443.000
      emission: "16K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 448.000 # +5 MHz input (inverted split, as published)
    mode:
      type: "FM"
      ctcss_rx_hz: 151.4
      ctcss_tx_hz: 151.4
      notes: "Published with a positive 5 MHz split (output 443.000 below input 448.000). Recorded as listed by RadioReference; verify on air."

authorizations:
  - id: auth_fcc_amateur_t
    authority: "FCC"
    service: "amateur"
    class: "Technician or higher"
    identifier: null
    notes: "TX requires a US amateur license."

assignments:
  - id: asgn_w2lv_147210
    short_name: "W2L210"
    channel_name: "W2LV 147.210"
    rf_chain_id: chain_w2lv_147210_fm
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
  - id: asgn_w2lv_147300
    short_name: "W2L300"
    channel_name: "W2LV 147.300"
    rf_chain_id: chain_w2lv_147300_fm
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
  - id: asgn_w2lv_147330
    short_name: "W2L330"
    channel_name: "W2LV 147.330"
    rf_chain_id: chain_w2lv_147330_fm
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
  - id: asgn_w2lv_224500
    short_name: "W2LV12"
    channel_name: "W2LV 224.500"
    rf_chain_id: chain_w2lv_224500_fm
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
  - id: asgn_w2lv_443000
    short_name: "W2LV7C"
    channel_name: "W2LV 443.000"
    rf_chain_id: chain_w2lv_443000_fm
    usage: "repeater"
    authorization_id: auth_fcc_amateur_t
