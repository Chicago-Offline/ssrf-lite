# yaml-language-server: $schema=../../../../_schema/ssrf-lite-0.5.3.schema.json
# SSRF-Lite: Chicagoland Airports (IL / IN / MI) — VHF AM Airband Voice
# Notes: RX-only reference. AM voice, 25 kHz channels (6K00A3E). TX requires an
#        FCC Part 87 aeronautical authorization; treat as receive-only.
#        Restricted to the 118.000-136.975 MHz voice band (navaids excluded).
# Sources:
# - ICAO Frequency Finder (https://frequency.icao.int)
# - Airportmap open databases (https://airportmap.de/data)
#   as compiled in infamy/NeonPlug airports_min.json

$schema: "../../../../_schema/ssrf-lite-0.5.3.schema.json"
ssrf_lite_version: "0.5.3"
ssrf_lite:
  sources:
    - name: ICAO Frequency Finder
      url: https://frequency.icao.int
      accessed: '2026-07-16'
    - name: Airportmap Open Databases
      url: https://airportmap.de/data
      accessed: '2026-07-16'
    - name: infamy/NeonPlug airports_min.json
      url: https://github.com/infamy/NeonPlug/blob/main/src/data/airports_min.json
      accessed: '2026-07-16'

