comments:
  - text: |
      Licensed business/industrial land mobile on the Chicago north side, filtered to the
      Bucktown-to-Evanston corridor from the RadioReference wiki Chicago business listing.
      
      FILTERING: the source page covers all of Chicago. Entries were kept only if they fall
      roughly north of North Avenue (1600 N) and east of Kedzie (3200 W). Downtown, Loop and
      Magnificent Mile entries were excluded as being south of Bucktown, and O'Hare-area,
      far-north-west (East River Road, Newcastle, Narragansett) and west-side (Kostner,
      Humboldt Park) entries were excluded as off-corridor.
      
      WHAT IS ACTUALLY RECEIVABLE: only eleven of these are repeaters. Everything else is a
      portable/mobile frequency, which is low power and usually indoors, so you generally need
      to be close to the building. The repeaters are the realistic scanning targets:
        S & C Electric        462.200 / 462.425   6601 N Ridge Blvd (Rogers Park)
        Rosehill Cemetery     463.5125            5800 N Ravenswood
        Lincoln Common        462.1625 / 461.775  2345 N Lincoln
        Horween Leather       464.150             2150 N Elston (Bucktown)
        Triangle Square       461.6625            2155 N Elston (Bucktown)
        Imperial Tower        461.550             4250 N Marine Dr
        Eugenie Terrace       464.1625            1730 N Clark
        2650 Lakeview         464.8625            2650 N Lakeview
        The New York          464.825             3660 N Lake Shore Dr
        Albany Park Comm Ctr  463.4125            3401 W Ainslie
      
      S & C Electric at 6601 N Ridge is the best-placed of these for the Evanston end of the
      corridor, and Horween and Triangle Square on N Elston cover the Bucktown end.
      
      Two VHF licensees are unusual for this band and worth noting: Costco at 2746 N Clybourn
      (151.655, 151.955) and the 2400 N Lakeview condo association (151.535 through 160.140).
      
      SOURCE DATA ISSUES: two frequencies in the source are malformed and were omitted rather
      than guessed - Commonwealth Plaza lists "4613.9875" (probably 461.9875) and Horizon House
      lists "456.3265" (not a valid 12.5 kHz channel). The Solverre Apartments and MQMF Chicago
      Marine Drive entries are the same licensee (WSCJ367, 4600 N Marine Drive) listed twice in
      the source and are merged here.
      
      Repeater input frequencies are not published by the source, so only outputs are recorded.
      
