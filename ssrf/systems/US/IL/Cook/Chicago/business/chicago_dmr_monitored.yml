# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.6.0.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.6.0.schema.json"
ssrf_lite_version: "0.6.0"
ssrf_lite:
  sources:
    - name: >-
        Chicago Offline UHF monitoring survey - RTL-SDR + dsd-fme, Chicago north
        side receive site. 2026-08-19/27 trigger-gated capture (2,059 decoder
        logs, 129 h dwell), talkgroup extraction 2026-09-25, live re-confirmation
        2026-09-25.
      url: null
      accessed: "2026-09-25"

organizations:
  - id: org_chi_dmr_monitored
    name: "Chicago DMR (monitor-confirmed, licensee unidentified)"

locations:
  - id: loc_chi_north_rx
    name: "Chicago north side receive site (approx)"
    lat: 41.9600
    lon: -87.6600

stations:
  - id: stn_chi_dmr_monitored
    call_sign: null
    organization_id: org_chi_dmr_monitored
    location_id: loc_chi_north_rx
    service: "business_itinerant_part90"

antennas:
  - id: ant_chi_north_rx
    station_id: stn_chi_dmr_monitored
    name: "Receive-only reference (HT whip at fixed bench)"
    gain_dbi: null
    height_agl_m: null
    height_amsl_m: null

# Color codes and talkgroups below are OBSERVED, not published. Each chain's
# mode.notes records the evidence margin so a reader can judge confidence.
# Transmitter (uplink) frequencies were never observed - this was a
# receive-only survey - so every tx.freq_mhz is null rather than guessed from
# a standard Part 90 offset.
rf_chains:
  - id: chain_chi_dmr_464_975
    station_id: stn_chi_dmr_monitored
    antenna_id: ant_chi_north_rx
    tx:
      freq_mhz: null
      emission: "7K60FXE"
    rx:
      freq_mhz: 464.9750
    mode:
      type: "DMR"
      color_code: 11
      timeslots: [1, 2]
      notes: >-
        CC=11 observed 788,054 times against 4,011 for the next-ranked value over
        76.3 h of dwell; 1.09 M DMR frames, 3,830 CSBK, 872 voice bursts. Busiest
        system found in the survey. High symbol-error channel: 26% of voice-header
        talkgroup values were single- or multi-bit corruptions of the three real
        talkgroups, so raw decoder output over-reports distinct groups badly
        (951 raw values, 3 real).
  - id: chain_chi_dmr_462_1375
    station_id: stn_chi_dmr_monitored
    antenna_id: ant_chi_north_rx
    tx:
      freq_mhz: null
      emission: "7K60FXE"
    rx:
      freq_mhz: 462.1375
    mode:
      type: "DMR"
      color_code: 3
      timeslots: [1]
      notes: >-
        CC=03 observed 422,426 times against 393 for the next-ranked value over
        45.5 h of dwell. Cleanest system in the survey - only 0.1% of voice
        headers were bit-flip corruptions, and just 19 distinct raw talkgroup
        values appeared across 10,181 voice-header bursts. All observed traffic
        was on timeslot 1; TS2 never carried a voice header, so timeslots is
        recorded as [1] rather than the [1, 2] default. Re-confirmed live
        2026-09-25 (112 DMR frames, CC=03 x109, in a 45 s probe).
  - id: chain_chi_dmr_452_3875
    station_id: stn_chi_dmr_monitored
    antenna_id: ant_chi_north_rx
    tx:
      freq_mhz: null
      emission: "7K60FXE"
    rx:
      freq_mhz: 452.3875
    mode:
      type: "DMR"
      color_code: 11
      timeslots: [1, 2]
      notes: >-
        Motorola Capacity Plus. CC=11 observed 181 times against 11 for the
        next-ranked value, with 95 Capacity Plus indications and 178 CSBK.
        Lower traffic volume than the other two chains, but the CC margin and
        the Cap+ signalling are unambiguous. FREQUENCY NEEDS CONFIRMATION: the
        decoder was tuned to 452.3854 MHz, a sweep bin centre rather than a
        channel centre; 452.3875 is the nearest Part 90 12.5 kHz channel and is
        recorded here. A confirming dwell at exactly 452.3875 is outstanding.

contacts:
  - id: tg_464975_1
    name: "464.9750 TG 1"
    kind: "Group"
    number: 1
    default_timeslot: 2
    notes: >-
        41.9% of voice-header bursts on this chain (3,152 of 7,524 after folding
        single-bit corruptions back to source), 17 distinct radio IDs observed.
  - id: tg_464975_1101
    name: "464.9750 TG 1101"
    kind: "Group"
    number: 1101
    default_timeslot: 2
    notes: >-
        38.1% of voice-header bursts (2,865 after bit-flip folding), 15 distinct
        radio IDs. Most frequent source IDs 505 and 551.
  - id: tg_464975_200
    name: "464.9750 TG 200"
    kind: "Group"
    number: 200
    default_timeslot: 1
    notes: >-
        1.0% of voice-header bursts (72), 5 distinct radio IDs. The only group
        seen on timeslot 1 on this chain.
  - id: tg_462137_50
    name: "462.1375 TG 50"
    kind: "Group"
    number: 50
    default_timeslot: 1
    notes: >-
        Primary and effectively sole talkgroup on this chain - 92.5% of
        voice-header bursts (9,412 of 10,181), 38 distinct radio IDs, all on
        timeslot 1. Remaining traffic is the DMR All Call broadcast address
        (16777215, 6.2%).

authorizations:
  - id: auth_fcc_part90
    authority: "FCC"
    service: "business_itinerant_part90"
    class: null
    identifier: null
    notes: >-
      Part 90 licensed land mobile. Licensee not identified - these systems were
      located by spectrum survey, not from a published source, and no FCC ULS
      frequency search has been run against them yet. Receive-only reference
      data; transmitting on these channels requires the licensee's authority.

assignments:
  - id: asgn_chi_dmr_464_975
    rf_chain_id: chain_chi_dmr_464_975
    usage: "repeater"
    authorization_id: auth_fcc_part90
    notes: >-
      Monitor-confirmed DMR repeater output. Talkgroups 1 and 1101 carry almost
      all traffic on TS2; TG 200 appears on TS1.
  - id: asgn_chi_dmr_462_1375
    rf_chain_id: chain_chi_dmr_462_1375
    usage: "repeater"
    authorization_id: auth_fcc_part90
    notes: >-
      Monitor-confirmed DMR repeater output. Single-talkgroup operation (TG 50)
      on TS1.
  - id: asgn_chi_dmr_452_3875
    rf_chain_id: chain_chi_dmr_452_3875
    usage: "repeater"
    authorization_id: auth_fcc_part90
    notes: >-
      Monitor-confirmed Motorola Capacity Plus system. No talkgroup captured -
      traffic volume was too low during the survey window for a voice header to
      be decoded.
