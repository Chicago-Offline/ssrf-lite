comments:
  - text: |
      Chicago hotel business land mobile, from the RadioReference database Chicago
      Businesses (Hotels) listing.
      
      SCOPE NOTE: every licensee here is downtown / Loop / Magnificent Mile, with the
      exception of Hilton Garden Inn at McCormick Place and Hyatt Regency at O'Hare.
      None of this is in the Bucktown-to-Evanston corridor - downtown is south of
      Bucktown. It is included because the data is unusually good (DMR colour codes,
      talkgroups and timeslots are documented), and downtown rooftop UHF repeaters are
      often receivable well up the north side.
      
      Most of these are DMR repeaters where several logical channels share one RF
      channel, separated by talkgroup and timeslot. Those are modelled as a single
      rf_chain with multiple assignments, and the talkgroups are recorded as contacts.
      
      Repeater input frequencies are not published by the source, so only outputs are
      recorded. The Fairmont operates under three separate call signs (WQUM495,
      WNWA694, WNPZ509) and is split into three organisations accordingly.
      
      RX-only for the general public per Part 90.
