# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.6.0.schema.json
# SSRF-Lite: Chicago EMS Services (RX-only focus)
# Sources: IDPH Region XI EMS resource plans, RadioReference Cook County DB export + wiki (Cook_County_(IL)_Chicago_City), last verified 2026-09-08
# Legacy CFD UHF EMS analog channels (460.600/460.625/462.975, 156.7 PL) have transitioned to P25 conventional per RR DB.

$schema: "../../../../../../_schema/ssrf-lite-0.6.0.schema.json"
ssrf_lite_version: "0.6.0"
organizations:
  - id: org_cfd_ems
    name: "Chicago Fire Department – EMS"
  - id: org_idph_regxi
    name: "IDPH Region XI EMS"

locations:
  - id: loc_chicago_regionxi
    name: "Chicago (Region XI EMS)"
    lat: 41.8781
    lon: -87.6298

stations:
  - id: stn_cfd_ems
    call_sign:
    organization_id: org_cfd_ems
    location_id: loc_chicago_regionxi
    service: "public_safety_part90"
  - id: stn_cmed_xi
    call_sign:
    organization_id: org_idph_regxi
    location_id: loc_chicago_regionxi
    service: "public_safety_part90"

antennas:
