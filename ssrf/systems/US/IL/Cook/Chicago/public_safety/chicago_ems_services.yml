    station_id: stn_cmed_xi
    name: "Region XI CMED UHF"

rf_chains:
  # Chicago Fire / EMS legacy UHF pairs, now P25 conventional (clear) per RR DB
  - id: chain_cfd_ems_command
    station_id: stn_cfd_ems
    antenna_id: ant_cfd_ems
    rx:
      freq_mhz: 460.600
    tx:
      emission: "8K10F1E"
    mode:
      type: "P25"
      nac: 458
      notes: "NAC $1CA. Fire: Main (patched w/ TG 1994). Former analog EMS North Ch 1 (156.7 PL)."

  - id: chain_cfd_ems_citywide
    station_id: stn_cfd_ems
    antenna_id: ant_cfd_ems
    rx:
      freq_mhz: 460.625
    tx:
      emission: "8K10F1E"
    mode:
      type: "P25"
      nac: 661
      notes: "NAC $295. Fire: Englewood (patched w/ TG 1995). Former analog EMS South Ch 2 (156.7 PL)."

