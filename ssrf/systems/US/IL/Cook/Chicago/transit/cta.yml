comments:
  - text: |
      Chicago Transit Authority rail and bus conventional channels.

      LICENCE CAVEAT: the source flags that many of these CTA licences have expired and the
      frequencies are now licensed to A-Beep, and explicitly asks for reports on whether they
      are still in use. Rail F-1 (expired 4/23) and F-2, F-5, F-6, F-7, F-8 (all expired 11/22)
      are recorded under a separate authorization (auth_cta_expired) so the uncertainty is
      visible rather than buried. These are good survey targets for the RTL-SDR rig - confirm
      or clear them before treating this set as current.

      Rail line mapping is the useful part for scanning: F-5 Blue/Pink, F-6 Green/Orange,
      F-7 Brown/Purple/Yellow, F-8 Red. F-3 and F-4 are the North and South supervisor
      channels and carry bus supervisor traffic as well as rail.

      Rail F-1 is labelled CPD Transit Alt - a Chicago Police transit channel on a CTA
      licence, distinct from the CPD channels in
      ssrf/systems/US/IL/Cook/Chicago/public_safety/chicago_police_department.yml.

      The bus repeaters use a +5.000 MHz split (453.x -> 458.x). Three of them run carrier
      squelch rather than a tone.

      NOT DUPLICATED HERE: the existing transit_transport.yml already carries CTA 461.575,
      461.825 (DMR), and 462.100; chicago_fire_ems_northside.yml already carries CTA Fire on
      460.0625 (203.5 PL). No frequency in this file overlaps either.

      44.540 MHz is low-band third-rail/switch heater control telemetry, not voice.

      RX-only for the general public per Part 90.
