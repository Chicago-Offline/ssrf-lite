# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.6.0.schema.json
# SSRF-Lite: Public Works & Parks (UHF FM/DMR, RX-only)
# Chicago municipal operations: Streets & Sanitation (DSS), Park District, and Forest Preserves of Cook County.
# RX-only monitoring. Frequencies and modes can vary by district and may change.

$schema: "../../../../../../_schema/ssrf-lite-0.6.0.schema.json"
ssrf_lite_version: "0.6.0"
organizations:
  - id: org_muni
    name: "Public Works & Parks"

locations:
  - id: loc_city
    name: "City of Chicago"
    lat: 41.8781
    lon: -87.6298

stations:
  - id: stn_muni
    call_sign:
    organization_id: org_muni
    location_id: loc_city
    service: "public_safety_part90"

antennas:
  - id: ant_m
    station_id: stn_muni
    name: "Portable"

rf_chains:
  # Chicago Streets & Sanitation (example district channels; FM conventional)
  - {id: ch_dss_north_1, station_id: stn_muni, antenna_id: ant_m, rx: {freq_mhz: 460.1375},
    tx: {emission: "11K2F3E"}, mode: {type: "FM"}}
  - {id: ch_dss_north_2, station_id: stn_muni, antenna_id: ant_m, rx: {freq_mhz: 
        460.1875}, tx: {emission: "11K2F3E"}, mode: {type: "FM"}}
  - {id: ch_dss_south_1, station_id: stn_muni, antenna_id: ant_m, rx: {freq_mhz: 
        460.2625}, tx: {emission: "11K2F3E"}, mode: {type: "FM"}}
  - {id: ch_dss_snow_ops, station_id: stn_muni, antenna_id: ant_m, rx: {freq_mhz: 
        453.900}, tx: {emission: "7K60FXE"}, mode: {type: "DMR", color_code: 11, 
        timeslots: [1, 2]}}

  # Chicago Park District Ops/Security (mix of FM/DMR conventional by site)
  - {id: ch_cpdistrict_ops1, station_id: stn_muni, antenna_id: ant_m, rx: {
        freq_mhz: 462.7125}, tx: {emission: "11K2F3E"}, mode: {type: "FM"}}
  - {id: ch_cpdistrict_ops2, station_id: stn_muni, antenna_id: ant_m, rx: {
        freq_mhz: 463.2625}, tx: {emission: "7K60FXE"}, mode: {type: "DMR", 
        color_code: 1, timeslots: [1, 2], notes: "Color code NOT verified; 1 
        assumed as the commonest commercial default so the channel can be 
        programmed. Replace with an observed value."}}

  # Forest Preserves of Cook County (FPDCC) – maintenance/security
  - {id: ch_fpdcc_ops1, station_id: stn_muni, antenna_id: ant_m, rx: {freq_mhz: 
        453.175}, tx: {emission: "11K2F3E"}, mode: {type: "FM"}}
  - {id: ch_fpdcc_ops2, station_id: stn_muni, antenna_id: ant_m, rx: {freq_mhz: 
        453.050}, tx: {emission: "7K60FXE"}, mode: {type: "DMR", color_code: 1, 
        timeslots: [1, 2], notes: "Color code NOT verified; 1 assumed as the 
        commonest commercial default so the channel can be programmed. Replace 
        with an observed value."}}

  # Chicago Department of Transportation (CDOT) & Streets/Sanitation
  # Source: RadioReference Cook County -> Chicago Department of Transportation
  # All RX-only monitoring. PL tones set where listed; conventional FM.
  - {id: ch_cdot_streets_n12, station_id: stn_muni, antenna_id: ant_m, rx: {
        freq_mhz: 453.650}, tx: {emission: "11K2F3E"}, mode: {type: "FM", 
        ctcss_rx_hz: 107.2, ctcss_tx_hz: 107.2}}
  - {id: ch_cdot_forestry_animal, station_id: stn_muni, antenna_id: ant_m, rx: {
        freq_mhz: 453.725}, tx: {emission: "11K2F3E"}, mode: {type: "FM", 
        ctcss_rx_hz: 107.2, ctcss_tx_hz: 107.2}}
  - {id: ch_cdot_towing_parking, station_id: stn_muni, antenna_id: ant_m, rx: {
        freq_mhz: 453.775}, tx: {emission: "11K2F3E"}, mode: {type: "FM", 
        ctcss_rx_hz: 107.2, ctcss_tx_hz: 107.2}}
  - {id: ch_cdot_revenue_boot, station_id: stn_muni, antenna_id: ant_m, rx: {
        freq_mhz: 453.825}, tx: {emission: "11K2F3E"}, mode: {type: "FM", 
        ctcss_rx_hz: 107.2, ctcss_tx_hz: 107.2}}
  - {id: ch_cdot_electricity_boe, station_id: stn_muni, antenna_id: ant_m, rx: {
        freq_mhz: 453.975}, tx: {emission: "11K2F3E"}, mode: {type: "FM", 
        ctcss_rx_hz: 107.2, ctcss_tx_hz: 107.2}}
  - {id: ch_cdot_sewers_transport, station_id: stn_muni, antenna_id: ant_m, rx: {
      freq_mhz: 453.675}, tx: {emission: "11K2F3E"}, mode: {type: "FM", 
        ctcss_rx_hz: 107.2, ctcss_tx_hz: 107.2}}
  - {id: ch_cdot_loop_ob3, station_id: stn_muni, antenna_id: ant_m, rx: {
        freq_mhz: 453.100}, tx: {emission: "11K2F3E"}, mode: {type: "FM", 
        ctcss_rx_hz: 107.2, ctcss_tx_hz: 107.2}}
  - {id: ch_cdot_streets_s45, station_id: stn_muni, antenna_id: ant_m, rx: {
        freq_mhz: 453.550}, tx: {emission: "11K2F3E"}, mode: {type: "FM", 
        ctcss_rx_hz: 107.2, ctcss_tx_hz: 107.2}}
  - {id: ch_cdot_paging, station_id: stn_muni, antenna_id: ant_m, rx: {freq_mhz: 
        453.500}, tx: {emission: "11K2F3E"}, mode: {type: "FM"}}

assignments:
  - {id: asg_dss_n1, channel_name: "DSS North 1", rf_chain_id: ch_dss_north_1, usage: "simplex"}
  - {id: asg_dss_n2, channel_name: "DSS North 2", rf_chain_id: ch_dss_north_2, usage: "simplex"}
  - {id: asg_dss_s1, channel_name: "DSS South 1", rf_chain_id: ch_dss_south_1, usage: "simplex"}
  - {id: asg_dss_snow, channel_name: "DSS Snow", rf_chain_id: ch_dss_snow_ops, usage: "simplex"}
  - {id: asg_cpd1, channel_name: "Park Dist 1", rf_chain_id: ch_cpdistrict_ops1, usage: "simplex"}
  - {id: asg_cpd2, channel_name: "Park Dist 2", rf_chain_id: ch_cpdistrict_ops2, usage: "repeater"}
  - {id: asg_fpd1, channel_name: "Forest Pres 1", rf_chain_id: ch_fpdcc_ops1, usage: "simplex"}
  - {id: asg_fpd2, channel_name: "Forest Pres 2", rf_chain_id: ch_fpdcc_ops2, usage: "repeater"}

  # CDOT assignments (RX-only)
  - {id: asg_cdot_streets_n12, channel_name: "Streets N 1/2", rf_chain_id: ch_cdot_streets_n12, usage: "repeater"}
  - {id: asg_cdot_forestry_animal, channel_name: "Forestry Animal", rf_chain_id: ch_cdot_forestry_animal, usage: "repeater"}
  - {id: asg_cdot_towing_parking, channel_name: "Towing Parking", rf_chain_id: ch_cdot_towing_parking, usage: "repeater"}
  - {id: asg_cdot_revenue_boot, channel_name: "Revenue Boot", rf_chain_id: ch_cdot_revenue_boot, usage: "repeater"}
  - {id: asg_cdot_electricity_boe, channel_name: "Electricity BOE", rf_chain_id: ch_cdot_electricity_boe, usage: "repeater"}
  - {id: asg_cdot_sewers_transport, channel_name: "Sewers Transprt", rf_chain_id: ch_cdot_sewers_transport, usage: "repeater"}
  - {id: asg_cdot_loop_ob3, channel_name: "Loop OB3", rf_chain_id: ch_cdot_loop_ob3, usage: "repeater"}
  - {id: asg_cdot_streets_s45, channel_name: "Streets S 4/5", rf_chain_id: ch_cdot_streets_s45, usage: "repeater"}
  - {id: asg_cdot_paging, channel_name: "CDOT Paging", rf_chain_id: ch_cdot_paging, usage: "receive-only"}

comments:
  - text: |
      Frequencies are representative/common allocations for municipal ops. Many ops have moved to trunked systems; these are legacy/conventional or site ops often still heard. RX-only.
