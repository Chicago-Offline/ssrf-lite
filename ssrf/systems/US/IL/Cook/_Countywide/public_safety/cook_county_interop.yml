antennas:
  - id: ant_cook_io_klr279
    station_id: stn_cook_io_klr279
    name: "Cook Interop VHF 1 repeater (site unknown)"
  - id: ant_cook_io_ksa717
    station_id: stn_cook_io_ksa717
    name: "Cook Interop VHF 2-4 repeaters (site unknown)"
  - id: ant_cook_io_ksc711
    station_id: stn_cook_io_ksc711
    name: "Cook Interop V Metro repeaters (site unknown)"
  - id: ant_cook_io_wqls615
