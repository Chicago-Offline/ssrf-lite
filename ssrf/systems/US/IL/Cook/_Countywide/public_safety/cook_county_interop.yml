    call_sign: "KLR279"
    organization_id: org_cook_interop
    location_id: loc_cook_county
    service: "public_safety_part90"
  - id: stn_cook_io_ksa717
    call_sign: "KSA717"
    organization_id: org_cook_interop
    location_id: loc_cook_county
