comments:
  - text: |
      Cook County interoperability channels. All analogue FM and unencrypted, which makes this
      the most RX-useful conventional set in the county now that most primary dispatch has
      moved to encrypted STARCOM21 P25.

      Interop radio tests run Wednesdays at 11:00 local - a reliable way to confirm these are
      live without waiting for an incident.

      These nine channels do NOT overlap the Illinois statewide interop set already in
      ssrf/systems/US/IL/_Statewide/public_safety/il_statewide_interop.yml (IFERN, IREACH,
      ISPERN, PTP, HEAR, VCALL/VTAC, UCALL/UTAC). Cook Interop U2 (453.750) does carry a
      full-time patch to ISPERN (155.475), which is in that statewide file.

      VHF 2/3/4 share frequencies with the Cook County Sheriff P25 channels (155.640, 155.595,
      155.535) - they are the same physical channels, with the analogue side retained as
      backup. VHF 3 and 4 are flagged as possibly deprecated by the source.

      Repeater input frequencies are not published in the source; only outputs are recorded.
      453.750 and 453.950 are also licensed for P25.

      RX-only for the general public per Part 90.
