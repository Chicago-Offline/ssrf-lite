    class: "Part 90 Public Safety"
    identifier: null
    notes: "TX restricted to licensees. RX-only for general public."

rf_chains:
  # --- P25 ---
  # Patrol North, multicast with STARCOM21 TG 25086. NAC 0x293 = 659.
  - id: chain_cook_shrf_patrol_n
    station_id: stn_cook_shrf_ksa717_p25
    antenna_id: ant_cook_shrf_ksa717_p25
    rx:
      freq_mhz: 155.595
    tx:
      emission: "8K10F1E"
    mode:
      type: "P25"
      nac: 659
      notes: "NAC 0x293. Encrypted. Multicast with STARCOM21 TG 25086."

  # Patrol South, multicast with STARCOM21 TG 25087. ~99% encrypted.
  - id: chain_cook_shrf_patrol_s
    station_id: stn_cook_shrf_ksa717_p25
    antenna_id: ant_cook_shrf_ksa717_p25
    rx:
      freq_mhz: 155.535
    tx:
      emission: "8K10F1E"
    mode:
      type: "P25"
      nac: 659
      notes: "NAC 0x293. Approximately 99 percent encrypted. Multicast with STARCOM21 TG 25087."

  # Backup Ops (Auxiliary Band 5) [Ch 5]
  - id: chain_cook_shrf_ops_backup
    station_id: stn_cook_shrf_kfm495_p25
    antenna_id: ant_cook_shrf_kfm495_p25
    rx:
      freq_mhz: 155.640
    tx:
      emission: "8K10F1E"
    mode:
      type: "P25"
      nac: 659
      notes: "NAC 0x293. Backup Sheriff Ops, Auxiliary Band 5, Ch 5. Repeater; input not published."

  # --- Analogue field ops (107.2 PL) ---
  # Car-to-Car [Ch 6]
  - id: chain_cook_shrf_c2c6
    station_id: stn_cook_shrf_kl6889
    antenna_id: ant_cook_shrf_kl6889
    rx:
      freq_mhz: 153.905
    tx:
      emission: "11K2F3E"
    mode:
      type: "FM"
      ctcss_rx_hz: 107.2
      ctcss_tx_hz: 107.2

  # Alternate [Ch 7]
  - id: chain_cook_shrf_alt7
    station_id: stn_cook_shrf_ksa718_ops
    antenna_id: ant_cook_shrf_ksa718_ops
    rx:
      freq_mhz: 159.090
    tx:
      emission: "11K2F3E"
    mode:
      type: "FM"
      ctcss_rx_hz: 107.2
      ctcss_tx_hz: 107.2

  # Tactical / Emergency Management [Ch 14]
  - id: chain_cook_shrf_tac14
    station_id: stn_cook_shrf_ksa718_ops
    antenna_id: ant_cook_shrf_ksa718_ops
    rx:
      freq_mhz: 158.865
    tx:
      emission: "11K2F3E"
    mode:
      type: "FM"
      ctcss_rx_hz: 107.2
      ctcss_tx_hz: 107.2

  # Rebroadcast of 155.535R (Patrol South)
  - id: chain_cook_shrf_alt7_rebroadcast
    station_id: stn_cook_shrf_kq6542_ops
    antenna_id: ant_cook_shrf_kq6542_ops
    rx:
      freq_mhz: 159.090
    tx:
      emission: "11K2F3E"
    mode:
      type: "FM"
      ctcss_rx_hz: 173.8
      ctcss_tx_hz: 173.8
      notes: "Analogue rebroadcast of the 155.535 Patrol South repeater."

  # Tactical [Ch 9]
  - id: chain_cook_shrf_tac9
    station_id: stn_cook_shrf_kq6542_ops
    antenna_id: ant_cook_shrf_kq6542_ops
    rx:
      freq_mhz: 153.845
    tx:
      emission: "11K2F3E"
    mode:
      type: "FM"
      ctcss_rx_hz: 107.2
      ctcss_tx_hz: 107.2

  # Tactical [Ch 12]
  - id: chain_cook_shrf_tac12
    station_id: stn_cook_shrf_kzu879_ops
    antenna_id: ant_cook_shrf_kzu879_ops
    rx:
      freq_mhz: 153.815
    tx:
      emission: "11K2F3E"
    mode:
      type: "FM"
      ctcss_rx_hz: 107.2
      ctcss_tx_hz: 107.2

  # --- Corrections / Courts (173.8 PL) ---
  # 153.845 / 173.8 carries BOTH Courts [Ch 10] and Jail [Ch 3]
  - id: chain_cook_doc_courts_jail3
    station_id: stn_cook_doc_kq6542
    antenna_id: ant_cook_doc_kq6542
    rx:
      freq_mhz: 153.845
    tx:
      emission: "11K2F3E"
    mode:
      type: "FM"
      ctcss_rx_hz: 173.8
      ctcss_tx_hz: 173.8
      notes: "Single channel listed twice by the source: Courts [Ch 10] and Jail [Ch 3]."

  # 154.025 / 173.8 carries BOTH Tactical [Ch 11] and Jail [Ch 2]
  - id: chain_cook_doc_tac11_jail2
    station_id: stn_cook_doc_kzu879
    antenna_id: ant_cook_doc_kzu879
    rx:
      freq_mhz: 154.025
    tx:
      emission: "11K2F3E"
    mode:
      type: "FM"
      ctcss_rx_hz: 173.8
      ctcss_tx_hz: 173.8
      notes: "Single channel listed twice by the source: Tactical [Ch 11] and Jail [Ch 2]."

  # Jail, Surveillance [Ch 1]
  - id: chain_cook_doc_jail1
    station_id: stn_cook_doc_kzu879
    antenna_id: ant_cook_doc_kzu879
    rx:
      freq_mhz: 153.815
    tx:
      emission: "11K2F3E"
    mode:
      type: "FM"
      ctcss_rx_hz: 173.8
      ctcss_tx_hz: 173.8

  # Corrections Vans / Transportation [Ch 4]
