comments:
  - text: |
      Cook County Sheriff. Primary Sheriff and County Jail operations now run on STARCOM21
      (P25 Phase II) sites 501/502/503 and are encrypted; the VHF channels here are the
      documented fallback system plus the two multicast patrol channels.

      The Sheriff's Police 911 Center also dispatches police for Berkeley, Blue Island,
      Chicago Heights, Cook County Forest Preserve, Crestwood, Golf, Harvey, Hometown,
      Indian Head Park, Lyons, Merrionette Park, Metra, Palos Park, Park Ridge, Phoenix,
      Prairie State College, Robbins and Worth, plus the State's Attorney's Investigators.

      Tone groups: 107.2 PL is the countywide field/tactical group; 173.8 PL is the
      corrections and courts group, modelled here at the 26th and California complex so the
      two groups stay distinguishable. Note that Tactical [Ch 11] shares 154.025 / 173.8 PL
      with Jail [Ch 2], and Courts [Ch 10] shares 153.845 / 173.8 PL with Jail [Ch 3] - each
      of those is one physical channel carrying two documented uses, so it is modelled as a
      single rf_chain with two assignments.

      155.640, 155.595 and 155.535 also appear as analogue backup channels in
      cook_county_interop.yml (Cook Interop V2/V3/V4) - same physical channels, analogue side.

      NAC 0x293 is recorded as decimal 659. Repeater input frequencies are not published in
      the source. RX-only for the general public per Part 90.
