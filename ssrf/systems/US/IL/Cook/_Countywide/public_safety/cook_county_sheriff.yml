# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.7.0.schema.json
# SSRF-Lite: Cook County Sheriff (VHF conventional fallback + P25 multicast)

$schema: "../../../../../../_schema/ssrf-lite-0.7.0.schema.json"
ssrf_lite_version: "0.7.0"
ssrf_lite:
  sources:
    - name: "RadioReference - Cook County, IL (Sheriff)"
      url: "https://www.radioreference.com/db/browse/ctid/606"
      accessed: "2026-09-26"

organizations:
  - id: org_cook_sheriff
    name: "Cook County Sheriff's Office"
  - id: org_cook_doc
    name: "Cook County Sheriff - Corrections and Courts"

locations:
