# ─── Authorizations ────────────────────────────────────────────────────────────

authorizations:
  - id: auth_fcc_part90
    authority: "FCC"
    service: "business_itinerant_part90"
    class: "Part 90 Business/Industrial"
    identifier: null
    notes: >
      Active FCC Part 90 licences. Call signs per chain: WPUI788 (Skokie 461.450),
      WPPB963 (Schaumb 151.550), KXZ278 (Schaumb 155.205), WPUA366 (Schaumb 452.975),
      WPPB802 (Hodgkins 451.825), WPYY371 (Franklin Park 461.775 — expired 10/2013),
      WPUF561 (Northbrook 463.825), WPWI814 (Calumet 463.850), WIK908 (Chicago 472.7375).
      TX restricted to the licensee. RX-only for general public.

  - id: auth_nolicense
    authority: "FCC"
    service: "business_itinerant_part90"
    identifier: null
    notes: >
      No FCC license listed in RadioReference for these repeaters (461.825 Skokie,
      463.975 EGV/HP/NB). May operate under a blanket or site licence not reflected
      in subcat data. Survey target; do not transmit without verifying authorization.

# ─── RF Chains ─────────────────────────────────────────────────────────────────
# Convention: radio-centric
#   tx.freq_mhz = what the radio transmits (repeater input)
#   rx.freq_mhz = what the radio receives  (repeater output) — what you hear
# RM rows: tx.freq_mhz null — input not published at anonymous access level.
# BM (simplex) rows: tx only, no rx.freq_mhz.
# FMN (RadioReference) → 11K2F3E.  DMR → 7K60FXE.
# Tone column is undirected; recorded as access/TX tone only (ctcss_tx_hz /
# dcs_tx_code). No ctcss_rx_hz set.

rf_chains:

  # ── Skokie Yard (WPUI788): 461.450 DMR — RM repeater ────────────────────────
  - id: chain_fs_skokie_461450
    station_id: stn_skokie
    antenna_id: ant_skokie
    tx:
      freq_mhz: null
      emission: "7K60FXE"
    rx:
      freq_mhz: 461.4500
    mode:
      type: "DMR"
      color_code: 6
      timeslots: [1, 2]

  # ── Skokie Yard (no license): 461.825 DMR — RM repeater ─────────────────────
  # No FCC license. Same CC6/TG pattern as 461.450 (WPUI788) — same operator,
  # separate repeater. NOTE: 461.825 DMR CC6 also appears in transit_transport.yml
  # as ch_cta_ops2 (attributed to CTA) — attribution unresolved, NOT duplicated
  # here. RR: used for Northwestern football shuttle service in 2024.
  - id: chain_fs_skokie_461825
    station_id: stn_skokie_nolicense
    antenna_id: ant_skokie_nolicense
    tx:
      freq_mhz: null
      emission: "7K60FXE"
    rx:
      freq_mhz: 461.8250
    mode:
      type: "DMR"
      color_code: 6
      timeslots: [1, 2]

  # ── Schaumburg Yard (WPPB963): 151.550 BM simplex ───────────────────────────
  - id: chain_fs_schaumb_151550
    station_id: stn_schaumburg_wppb963
    antenna_id: ant_schaumburg_wppb963
    tx:
      freq_mhz: 151.5500
      emission: "11K2F3E"
    mode:
      type: "FM"
      dcs_tx_code: "072"
      dcs_tx_polarity: "N"

  # ── Schaumburg Yard (KXZ278): 155.205 BM simplex ────────────────────────────
  - id: chain_fs_schaumb_155205
    station_id: stn_schaumburg_kxz278
    antenna_id: ant_schaumburg_kxz278
    tx:
      freq_mhz: 155.2050
      emission: "11K2F3E"
    mode:
      type: "FM"
      ctcss_tx_hz: 107.2

  # ── Schaumburg Yard (WPUA366): 452.975 BM simplex ───────────────────────────
  - id: chain_fs_schaumb_452975
    station_id: stn_schaumburg_wpua366
    antenna_id: ant_schaumburg_wpua366
    tx:
      freq_mhz: 452.9750
      emission: "11K2F3E"
    mode:
      type: "FM"
      ctcss_tx_hz: 218.1

  # ── Hodgkins Yard (WPPB802): 451.825 RM repeater ────────────────────────────
  - id: chain_fs_hodgkins_451825
    station_id: stn_hodgkins
    antenna_id: ant_hodgkins
    tx:
      freq_mhz: null
      emission: "11K2F3E"
    rx:
      freq_mhz: 451.8250
    mode:
      type: "FM"
      dcs_tx_code: "306"
      dcs_tx_polarity: "N"

  # ── Franklin Park (WPYY371): 461.775 RM repeater — LICENSE EXPIRED ───────────
  - id: chain_fs_franklin_park_461775
    station_id: stn_franklin_park
    antenna_id: ant_franklin_park
    tx:
      freq_mhz: null
      emission: "11K2F3E"
    rx:
      freq_mhz: 461.7750
    mode:
      type: "FM"
      dcs_tx_code: "051"
      dcs_tx_polarity: "N"

  # ── Northbrook Yard (WPUF561): 463.825 BM simplex ───────────────────────────
  # BM class (simplex/mobile), DMR. TG 16777215 = all-call.
  - id: chain_fs_northbrook_463825
    station_id: stn_northbrook
    antenna_id: ant_northbrook
    tx:
      freq_mhz: 463.8250
      emission: "7K60FXE"
    mode:
      type: "DMR"
      color_code: 6
      timeslots: [2]

  # ── Calumet Yard (WPWI814): 463.850 RM repeater ─────────────────────────────
  # RR note: also associated with Posen yard historically.
  - id: chain_fs_calumet_463850
    station_id: stn_calumet
    antenna_id: ant_calumet
    tx:
      freq_mhz: null
      emission: "7K60FXE"
    rx:
      freq_mhz: 463.8500
    mode:
      type: "DMR"
      color_code: 12
      timeslots: [1, 2]

  # ── EGV / Highland Park / Northbrook: 463.975 RM — no license ───────────────
  # SL1 attributed to EGV Yard; SL2 to HP/Northbrook Yards.
  # One physical transmitter → one chain; assignments distinguish operational use.
  - id: chain_fs_463975
    station_id: stn_elk_grove_village
    antenna_id: ant_elk_grove_village
    tx:
      freq_mhz: null
      emission: "7K60FXE"
    rx:
      freq_mhz: 463.9750
    mode:
      type: "DMR"
      color_code: 9
      timeslots: [1, 2]

  # ── Chicago (WIK908): 472.7375 RM repeater ──────────────────────────────────
  - id: chain_fs_chicago_472737
    station_id: stn_chicago
    antenna_id: ant_chicago
    tx:
      freq_mhz: null
      emission: "11K2F3E"
    rx:
      freq_mhz: 472.7375
    mode:
      type: "FM"
      ctcss_tx_hz: 173.8

