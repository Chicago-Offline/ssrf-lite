# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
# SSRF-Lite: Cook County, IL - First Student school bus / mass transit operations

$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "RadioReference - Bus Companies / First Student (subcat 21814)"
      url: "https://www.radioreference.com/db/subcat/21814"
      accessed: "2026-10-08"
      notes: >
        Anonymous access — single undirected Tone column; input frequencies not
        published at this access level. All RM entries have tx.freq_mhz: null.
        Coverage center: 41.87774 / -87.76428, range 31.05 mi (Defined Coverage).
        Page note: 463.850 repeater also used by Posen yard in the past; 461.825
        repeater used for shuttles during 2024 Northwestern football season.

# ─── Organizations ─────────────────────────────────────────────────────────────

organizations:
