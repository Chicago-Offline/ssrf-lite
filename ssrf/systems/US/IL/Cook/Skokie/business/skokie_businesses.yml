comments:
  - text: |
      Licensed business/industrial land mobile in Skokie, from the RadioReference wiki
      business listing for North Cook County.
      
      Worth knowing what is realistically receivable here: only five of these are repeaters
      (Community Safety Services 463.650 and 463.9375, Macy's 463.350 and 463.875). Everything
      else is a portable/mobile unit frequency - low power, usually indoors, so you generally
      need to be close to the site. They are recorded for completeness and for identifying
      unknown signals, not because they are wide-area targets.
      
      Repeater input frequencies are not published in the source, so only outputs are recorded.
      
      The DoubleTree Hotel North Shore licence is recorded by the source as expired in 2017 and
      is filed under a separate authorization so the status stays visible.
      
      RX-only for the general public per Part 90.
