$schema: "../../../../../../_schema/ssrf-lite-0.8.0.schema.json"
ssrf_lite_version: "0.8.0"
ssrf_lite:
  sources:
    - name: "RadioReference - Chicago Botanic Garden (Glencoe) business radio listing"
      url: "https://www.radioreference.com/db/browse/ctid/523"
      accessed: "2026-09-26"
    - name: "FCC ULS bulk data, Land Mobile - Private (l_LMpriv) weekly dump, call sign WNKX791"
      url: "https://www.fcc.gov/uls/transactions/daily-weekly"
      accessed: "2026-09-26"

comments:
  - text: |
      Chicago Botanic Garden, 1000 Lake Cook Rd, Glencoe, IL 60022 (Cook County).
      Conventional Part 90 UHF business repeater system, 12.5 kHz narrowband FM.
  - text: |
      AUTHORIZATION STATUS: FCC ULS shows WNKX791 EXPIRED 2024-06-22 and CANCELLED
      2024-08-24 (granted 2014-04-11, service code IG, eligibility rule 90.35). No
      successor Chicago Botanic Garden license was found in the 2026-09-26 l_LMpriv or
      l_LMcomm dumps. The system is still listed as active in RadioReference, so the
      hardware is presumed on the air under a renewal or relicense not yet reflected in
      the bulk data. Frequencies are retained here as monitoring reference, not as
      evidence of current authorization.
  - text: |
      SOURCE CORRECTION 1: the RadioReference free-text header gives the call sign as
      WNKY791. That call sign returns zero records in FCC ULS. The tabular listing's
      WNKX791 is correct and is used throughout this file.
  - text: |
      SOURCE CORRECTION 2: RadioReference lists the input for 464.1000 (CBG Garden 7) as
      468.1000, a non-standard +4.0 MHz split. FCC ULS shows 464.1000 paired with
      469.1000 on WNKX791, and 468.1000 does not appear anywhere on the license. This
      file uses 469.1000 (+5.0 MHz).
  - text: |
      464.0625/469.0625 and 464.5250/469.5250 are authorized on WNKX791 but carry no
      published tone or usage. 464.5250/469.5250 appears in the FCC license only - it is
      not in the RadioReference listing.
  - text: |
      457.1125, 457.2875, 457.4125, 457.6875 and 457.8625 are low-power mobile/on-site
      itinerant frequencies on the license. RadioReference notes NFM/NXDN operation on
      these; no NXDN RAN has been observed, so mode is left as FM with a note.
  - text: |
      DPL codes come from RadioReference and are published as a single code per channel;
      they are recorded as matching TX/RX DCS with normal polarity, which is the usual
      Part 90 configuration but has not been independently verified off-air.

