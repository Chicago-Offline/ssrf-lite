  - id: chain_wqol665_461p5375
    station_id: stn_wqol665
    antenna_id: ant_wqol665
    tx:
      freq_mhz: 461.5375
      emission: "11K2F3E"
      power_w: 2.0
      bandwidth_khz: 12.5
    mode:
      type: "FM"
      notes: >
        ULS freq ID 1, station class MO. Also authorised 11K2F1D (narrowband data)
        and 7K60FXD / 7K60FXE (DMR); on-air mode not observed. Low half of the 461.5375 / 466.5375 conventional 5.0 MHz pair.
