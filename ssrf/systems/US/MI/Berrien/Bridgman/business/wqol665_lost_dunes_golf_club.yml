# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
# SSRF-Lite: Lost Dunes Golf Club (WQOL665) - licensed business land mobile, Bridgman MI
#
# Mobile-only licence: all 8 ULS frequency records are station class MO. There is no
# FB/FB2 record, so no repeater is authorised under this call sign even though the
# eight frequencies form four conventional UHF mobile-relay splits. Modelled as eight
# simplex channels rather than four repeater pairs, to avoid asserting a repeater the
# licence does not authorise.
#
# The licence has no fixed site - Location 1 is a 5.0 km mobile radius. The coordinates
# below are the ULS radius centerpoint, i.e. an area of operation, not a tower.

$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "FCC ULS License Search - WQOL665 (Lost Dunes Golf Club LLC), licKey 3330243"
      url: "https://wireless2.fcc.gov/UlsApp/UlsSearch/license.jsp?licKey=3330243"
      accessed: "2026-10-10"

organizations:
  - id: org_lost_dunes_golf_club
    name: "Lost Dunes Golf Club LLC (8910 Red Arrow Hwy, Bridgman, MI 49106)"

locations:
  - id: loc_lost_dunes_bridgman
    name: "Lost Dunes Golf Club, Bridgman, MI (ULS mobile centerpoint, 5.0 km radius of operation)"
    lat: 41.9570
    lon: -86.5528

stations:
  - id: stn_wqol665
    call_sign: "WQOL665"
    organization_id: org_lost_dunes_golf_club
    location_id: loc_lost_dunes_bridgman
    service: "business_itinerant_part90"

antennas:
  - id: ant_wqol665
    station_id: stn_wqol665
    name: "Lost Dunes Golf Club mobiles and portables (no fixed site licensed)"

authorizations:
  - id: auth_wqol665
    authority: "FCC"
    service: "business_itinerant_part90"
    class: "Part 90 Business/Industrial"
    identifier: "WQOL665"
    notes: >
      Active FCC licence, IG - Industrial/Business Pool, Conventional. Granted
      2021-08-24, effective 2025-07-03, expires 2031-11-08. FRN 0021166392.
      Eligibility rule 90.35(A), stated purpose "we are a golf course and we will
      use radios to better coordinate our activities". 20 units, 2.000 W output /
      4.000 W ERP on every record. TX restricted to the licensee; RX-only for
      everyone else. A prior licence WPLL650 (FRN 0007406531) under the non-LLC
      name "Lost Dunes Golf Club" expired 2013-05-08 and is not modelled here.

