ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "FCC ULS License Search - WPTH866 (La Porte County Historical Steam Society Inc), licKey 2355133"
      url: "https://wireless2.fcc.gov/UlsApp/UlsSearch/license.jsp?licKey=2355133"
      accessed: "2026-10-10"
    - name: "FCC ULS weekly bulk dump l_LMpriv (FR/EM/LO/HD/EN tables), week of 2026-10-04"
      url: "https://data.fcc.gov/download/pub/uls/complete/l_LMpriv.zip"
      accessed: "2026-10-10"

