    lon: -86.678528

stations:
  - id: stn_wpth866
    call_sign: "WPTH866"
    organization_id: org_laporte_county_historical_steam_society
    location_id: loc_hesston_steam_museum
    service: "business_itinerant_part90"

antennas:
  - id: ant_wpth866_fixed
    station_id: stn_wpth866
    name: "Hesston Steam Museum fixed repeater site (ULS Location 1)"
  - id: ant_wpth866_mobile
    station_id: stn_wpth866
    name: "Hesston Steam Museum mobiles and portables (ULS Location 2, 16.0 km radius)"

authorizations:
  - id: auth_wpth866
    authority: "FCC"
    service: "business_itinerant_part90"
    class: "Part 90 Business/Industrial"
    identifier: "WPTH866"
    notes: >
      Active FCC licence, IG - Industrial/Business Pool, Conventional. First
      licensed 2001-10-05, granted and effective 2021-11-02, expires 2031-10-05.
      FRN 0005276340; filings handled by Lone Peak Licensing LLC (agent, not the
      licensee). Eligibility rule 90.35(A), stated purpose "business entity engaged
      in the commercial operation of a steam museum". Four ULS locations:
      1 fixed site (coordinates above), 2 mobile 16.0 km radius about Location 1,
      3 control station (6.1 m) within La Porte County, 4 temporary fixed 16.0 km
      radius about Location 1. TX restricted to the licensee; receive-only for
      everyone else.

rf_chains:
  - id: chain_wpth866_462p425
    station_id: stn_wpth866
    antenna_id: ant_wpth866_fixed
    tx:
      freq_mhz: 462.425
      emission: "11K2F3E"
      power_w: 50.0
      bandwidth_khz: 12.5
    rx:
      freq_mhz: 467.425
    mode:
      type: "FM"
      notes: >
        Repeater output 462.42500 (ULS Location 1 freq ID 1, station class FB2,
        50.000 W output / 75.000 W ERP); input 467.42500, a conventional +5.0 MHz
        split carried as Location 2 MO (50.000 W) and Location 3 FX1 control
        station (25.000 W output / 75.000 W ERP). Location 4 repeats 462.42500 as
        FBT (25 W) and FB2T (50 W) for temporary fixed operation. Also authorised 11K2F2D, 11K2F1D, 8K30F1E, 8K30F1D,
        7K60FXE / 7K60FXD (DMR) and 4K00F1E / 4K00F1D. On-air mode not observed -
        ULS records no CTCSS/DCS tone, DMR colour code, time slot or talkgroup, so
        receive-only users must search. TX restricted to the licensee.
  - id: chain_wpth866_462p4375
    station_id: stn_wpth866
    antenna_id: ant_wpth866_mobile
