# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
# SSRF-Lite: La Porte County Historical Steam Society (WPTH866) - Hesston Steam Museum,
# La Porte County, IN
#
# Unlike the mobile-only business licences nearby, this licence DOES authorise a
# repeater: ULS Location 1 is a fixed site with station class FB2 on 462.42500, and a
# matching FX1 control station at Location 3 sits on the +5.0 MHz input 467.42500.
# Modelled as one repeater pair plus the low-power mobile-only simplex channels.
#
# Nearest fixed DMR-capable site to the Saugany Lake area (~8.1 km / 5.0 mi).
# 462.425 is a Part 90 Industrial/Business channel, NOT a GMRS channel - do not
# confuse it with the unrelated Chicago-area 462.425 users already in this catalog.

