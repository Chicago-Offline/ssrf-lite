# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
# SSRF-Lite: La Porte County (IN) Public Safety
# Notes: Conventional VHF/UHF channels for county sheriff, EMS, fire, EMA, and Westville PD. Programmed receive-only; statewide P25 talkgroups are omitted.
#
# Originally transcribed from a RadioReference CSV export. Audited against FCC ULS
# on 2026-10-10; station classes, powers and licence status below are ULS-derived.
# 🔴 TWO OF THE FIVE CITED CALL SIGNS ARE EXPIRED - see the station notes and the
# comments block at the end before trusting the sheriff or EMS entries.
#
# Tones in this file came from the original RR export and have NOT been verified
# on air. ULS records no tone data at all.

$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "RadioReference CSV export 'laporte_county - Sheet1.csv' (original transcription; source of all tone values)"
      url: "https://wiki.radioreference.com/index.php/La_Porte_County_(IN)"
      accessed: "2026-10-10"
    - name: "FCC ULS weekly bulk dump (HD/EN/LO/FR tables), week of 2026-10-04 - audit of call signs KSA487, KSO422, WPUU802, WQQY208, WQKC612"
      url: "https://data.fcc.gov/download/pub/uls/complete/l_LMpriv.zip"
      accessed: "2026-10-10"

organizations:
  - id: org_laporte_sheriff
    name: "La Porte County Sheriff"
  - id: org_laporte_ems
    name: "La Porte County EMS"
  - id: org_laporte_ema
    name: "La Porte County Emergency Management"
  - id: org_laporte_fire
    name: "La Porte County Fire"
  - id: org_westville_pd
    name: "Westville Police Department"

locations:
  - id: loc_laporte_county
    name: "La Porte County (approx)"
    lat: 41.6105983
    lon: -86.7225227

stations:
  # 🔴 KSA487 licence status E (EXPIRED 2022-03-02) per FCC ULS. ULS last showed
  # FB2 155.0100 at 350 W and FB 155.3700 at 350 W. The frequencies may still be
  # in use under a renewed or replacement call sign - La Porte County also holds
  # active WQQY208, WQBY970 and WPTF278 - but this call sign is not current.
  - id: stn_laporte_sheriff
    call_sign: "KSA487"
    organization_id: org_laporte_sheriff
    location_id: loc_laporte_county
    service: "public_safety_part90"
  # 🔴 KSO422 licence status E (EXPIRED 2024-05-21) per FCC ULS. ULS last showed
  # FB2 155.2200 at 300 W. Same caveat as above.
  - id: stn_laporte_ems
    call_sign: "KSO422"
    organization_id: org_laporte_ems
    location_id: loc_laporte_county
    service: "public_safety_part90"
  - id: stn_laporte_ema
    call_sign: "WPUU802"
    organization_id: org_laporte_ema
    location_id: loc_laporte_county
    service: "public_safety_part90"
  - id: stn_laporte_fire
    call_sign: "WQQY208"
    organization_id: org_laporte_fire
    location_id: loc_laporte_county
    service: "public_safety_part90"
  - id: stn_westville_pd
    call_sign: "WQKC612"
    organization_id: org_westville_pd
    location_id: loc_laporte_county
    service: "public_safety_part90"

antennas:
  - id: ant_laporte_sheriff
    station_id: stn_laporte_sheriff
    name: "Sheriff Dispatch Antenna"
  - id: ant_laporte_ems
    station_id: stn_laporte_ems
    name: "County EMS Antenna"
  - id: ant_laporte_ema
    station_id: stn_laporte_ema
    name: "EMA/Warning Siren Antenna"
  - id: ant_laporte_fire
    station_id: stn_laporte_fire
    name: "County Fire Network"
  - id: ant_westville_pd
    station_id: stn_westville_pd
    name: "Westville PD Antenna"

rf_chains:
  # Sheriff / County Ops
  - id: chain_laporte_sheriff_dispatch
    station_id: stn_laporte_sheriff
    antenna_id: ant_laporte_sheriff
    tx:
      freq_mhz: 155.010
      emission: "11K2F3E"
    mode:
      type: "FM"
      dcs_tx_code: "244"

  - id: chain_laporte_sheriff_car
    station_id: stn_laporte_sheriff
    antenna_id: ant_laporte_sheriff
    tx:
      freq_mhz: 156.210
      emission: "11K2F3E"
    mode:
      type: "FM"

  - id: chain_laporte_sheriff_swat
    station_id: stn_laporte_sheriff
    antenna_id: ant_laporte_sheriff
    tx:
      freq_mhz: 153.8525
      emission: "11K2F3E"
    mode:
      type: "FM"

  - id: chain_laporte_jail
    station_id: stn_laporte_sheriff
    antenna_id: ant_laporte_sheriff
    tx:
      freq_mhz: 154.8675
      emission: "11K2F3E"
    mode:
      type: "FM"
      dcs_tx_code: "132"

    # EMS / EMA / Municipal
  - id: chain_laporte_ems_dispatch
    station_id: stn_laporte_ems
    antenna_id: ant_laporte_ems
    tx:
      freq_mhz: 155.220
      emission: "11K2F3E"
    mode:
      type: "FM"
      dcs_tx_code: "051"

  - id: chain_laporte_ema_ops
    station_id: stn_laporte_ema
    antenna_id: ant_laporte_ema
    tx:
      freq_mhz: 151.400
      emission: "11K2F3E"
      power_w: 90
    mode:
      type: "FM"
      notes: >
        WPUU802, ULS station class FB2 at 90 W, licence active to 2032-05-07 - so
        the repeater classification is correct and FCC-backed. However this is
        reported to be the COUNTYWIDE WARNING SIREN CONTROL channel, converted to
        ASC FSK data rather than voice, so expect data bursts and not a
        conversation. The "EMA Ops" label is inherited from the original CSV and
        is probably wrong. Not verified on air.

  - id: chain_westville_pd
    station_id: stn_westville_pd
    antenna_id: ant_westville_pd
    tx:
      freq_mhz: 154.0625
      emission: "11K2F3E"
      power_w: 25
    mode:
      type: "FM"
      notes: >
        WQKC612, ULS station class FB (base) at 25 W, licence active to
        2029-03-31. FB is not a repeater, so this is simplex - corrected from the
        original CSV, which had it as a repeater.

    # County Fire Network
  - id: chain_laporte_fire_dispatch
    station_id: stn_laporte_fire
    antenna_id: ant_laporte_fire
    tx:
      freq_mhz: 154.160
      emission: "11K2F3E"
    mode:
      type: "FM"
      ctcss_tx_hz: 141.3

  - id: chain_laporte_fire_tertiary
    station_id: stn_laporte_fire
    antenna_id: ant_laporte_fire
    tx:
      freq_mhz: 153.355
      emission: "11K2F3E"
    mode:
      type: "FM"
      ctcss_tx_hz: 141.3

  - id: chain_laporte_fireground14
    station_id: stn_laporte_fire
    antenna_id: ant_laporte_fire
    tx:
      freq_mhz: 156.240
      emission: "11K2F3E"
    mode:
      type: "FM"
      dcs_tx_code: "051"

  - id: chain_laporte_fireground5
    station_id: stn_laporte_fire
    antenna_id: ant_laporte_fire
    tx:
      freq_mhz: 151.055
      emission: "11K2F3E"
    mode:
      type: "FM"
      dcs_tx_code: "712"

  - id: chain_laporte_fireground6
    station_id: stn_laporte_fire
    antenna_id: ant_laporte_fire
    tx:
      freq_mhz: 154.240
      emission: "11K2F3E"
    mode:
      type: "FM"
      dcs_tx_code: "051"

  - id: chain_laporte_fireground7
    station_id: stn_laporte_fire
    antenna_id: ant_laporte_fire
    tx:
      freq_mhz: 154.355
      emission: "11K2F3E"
    mode:
      type: "FM"
      ctcss_tx_hz: 210.7

  - id: chain_laporte_fire_mutual_aid
    station_id: stn_laporte_fire
    antenna_id: ant_laporte_fire
    tx:
      freq_mhz: 154.280
      emission: "11K2F3E"
    mode:
      type: "FM"
      notes: >
        154.2800 is the national fire mutual-aid simplex channel (VFIRE21). It is
        not a repeater output - corrected from the original CSV. Nearby holders
        file it as station class FB (base), e.g. Michigan City KAR334 at 110 W.

assignments:
  # Sheriff / Corrections
  - id: asg_laporte_sheriff_dispatch
    rf_chain_id: chain_laporte_sheriff_dispatch
    usage: "repeater"
  - id: asg_laporte_sheriff_car
    rf_chain_id: chain_laporte_sheriff_car
    usage: "repeater"
  - id: asg_laporte_sheriff_swat
    rf_chain_id: chain_laporte_sheriff_swat
    usage: "simplex"
  - id: asg_laporte_jail
    rf_chain_id: chain_laporte_jail
    usage: "repeater"
  - id: asg_laporte_ems_dispatch
    rf_chain_id: chain_laporte_ems_dispatch
    usage: "repeater"
  - id: asg_laporte_ema_ops
    rf_chain_id: chain_laporte_ema_ops
    usage: "repeater"
  - id: asg_westville_pd
    rf_chain_id: chain_westville_pd
    usage: "simplex"
  - id: asg_laporte_fire_dispatch
    rf_chain_id: chain_laporte_fire_dispatch
    usage: "repeater"
  # asg_laporte_fire_secondary removed 2026-10-10: it pointed at the SAME rf_chain
  # as asg_laporte_fire_dispatch (154.1600), so it was a duplicate channel, not a
  # second frequency. ULS shows WQQY208 holding 154.1600 FB2 at both 100 W and
  # 50 W, which is one repeater filed at two power levels - still one channel.
  - id: asg_laporte_fire_tertiary
    rf_chain_id: chain_laporte_fire_tertiary
    usage: "repeater"
  - id: asg_laporte_fireground14
    rf_chain_id: chain_laporte_fireground14
    usage: "repeater"
  - id: asg_laporte_fireground5
    rf_chain_id: chain_laporte_fireground5
    usage: "repeater"
  - id: asg_laporte_fireground6
    rf_chain_id: chain_laporte_fireground6
    usage: "simplex"
  - id: asg_laporte_fireground7
    rf_chain_id: chain_laporte_fireground7
    usage: "simplex"
  - id: asg_laporte_mutual_aid
    rf_chain_id: chain_laporte_fire_mutual_aid
    usage: "simplex"
comments:
  - text: |
      Frequencies replicated from the provided La Porte County public-safety CSV. Channels are modeled for receive-only monitoring of legacy VHF/UHF resources; statewide P25 trunked talkgroups are not included. Fireground 1-4 share a common output with differing uplink tones on input.
  - text: |
      FCC ULS audit, 2026-10-10.

      EXPIRED call signs still cited here:
        KSA487  La Porte County (sheriff)  status E, expired 2022-03-02
        KSO422  La Porte County (EMS)      status E, expired 2024-05-21
      Both were FB2 repeaters in ULS (155.0100 at 350 W; 155.2200 at 300 W). The
      channels are probably still on the air under renewed or replacement call
      signs - the county also holds active WQQY208, WQBY970 and WPTF278 - but the
      call signs recorded here are not current and should not be quoted as proof
      of an active licence.

      CONFIRMED active and correctly classified:
        WPUU802  151.4000 FB2  90 W   expires 2032-05-07
        WQQY208  154.1600 FB2 100 W / 50 W, 154.3550 FB2 100 W, 156.2400 FB2 50 W
                                      expires 2033-03-22
        WQKC612  154.0625 FB   25 W   expires 2029-03-31  (FB = base, not repeater)

      CORRECTED in this pass:
        154.0625 Westville  repeater -> simplex  (ULS class FB)
        154.2800 mutual aid repeater -> simplex  (VFIRE21 national simplex)
        duplicate asg_laporte_fire_secondary removed (same chain as _dispatch)

      NOT VERIFIED - no matching La Porte County base/repeater record was found in
      the ULS bulk dump for these, so their "repeater" usage is unproven:
        156.2100 (sheriff car-to-car), 153.8525 (sheriff SWAT),
        154.8675 (jail - note La Porte County WQBY970 does hold 154.8675 FB2,
        so this one is likely fine but is filed under a different call sign than
        the KSA487 recorded above).

      All tone values in this file are from the RadioReference export and remain
      unverified on air; FCC ULS carries no tone data.
