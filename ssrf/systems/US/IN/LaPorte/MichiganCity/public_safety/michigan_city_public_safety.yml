authorizations:
  - id: auth_wqnh596
    authority: "FCC"
    service: "public_safety_part90"
    class: "Part 90 Public Safety"
    identifier: "WQNH596"
    notes: "Active. City of Michigan City. Single fixed site, station class FB2 (repeater)."
  - id: auth_wpyu546
    authority: "FCC"
    service: "public_safety_part90"
    class: "Part 90 Public Safety"
    identifier: "WPYU546"
    notes: >
      Active, expires 2033-10-30. City of Michigan City. Station class FB2
      (repeater). RadioReference community reporting describes this frequency as
      Michigan City fire dispatch; that role is not stated by the FCC and has not
      been verified on air.
  - id: auth_wsmu278
    authority: "FCC"
    service: "public_safety_part90"
    class: "Part 90 Public Safety"
    identifier: "WSMU278"
    notes: "Active. City of Michigan City. Station class FB2 (repeater)."
  - id: auth_kws467
    authority: "FCC"
    service: "public_safety_part90"
    class: "Part 90 Public Safety"
    identifier: "KWS467"
    notes: >
      Active. City of Michigan City. Station class FB (base), so simplex rather
      than a repeater. Emission list includes 7K60FXD/7K60FXE, so DMR is
      authorised on this channel.
  - id: auth_wre645
    authority: "FCC"
    service: "public_safety_part90"
    class: "Part 90 Public Safety"
    identifier: "WRE645"
    notes: >
      Active. City of Michigan City. Station class FB2 (repeater), UHF. Emission
      list includes 7K60FXD/7K60FXE, so DMR is authorised on this channel.
  - id: auth_kar334
    authority: "FCC"
    service: "public_safety_part90"
    class: "Part 90 Public Safety"
    identifier: "KAR334"
    notes: >
      Active. City of Michigan City. Station class FB (base) on 154.2800 and
      154.4300 across six fixed sites: 2504 E Michigan Blvd, 117 W 4th St,
      US Hwy 212, 200 SE US Highway 12, 1012 Ohio Street and 5000 Cleveland Road.
      Modelled once per frequency at 117 W 4th St; the remaining sites are
      co-channel on the same pair.

rf_chains:
  - id: chain_wqnh596_154p115
    station_id: stn_wqnh596
    antenna_id: ant_wqnh596
    tx:
      freq_mhz: 154.115
      emission: "11K2F3E"
      power_w: 60
      bandwidth_khz: 12.5
    rx:
      freq_mhz: 159.255
    mode:
      type: "FM"
      notes: >
        ULS Location 1, station class FB2, 60 W. Input 159.2550 (+5.1400 MHz
        split) - the licence carries exactly one mobile frequency other than the
        output, so the pairing is unambiguous. Authorised emission 11K2F3E only;
        no DMR designator on this channel.
  - id: chain_wpyu546_155p6775
    station_id: stn_wpyu546
    antenna_id: ant_wpyu546
    tx:
      freq_mhz: 155.6775
      emission: "11K2F3E"
      power_w: 40
      bandwidth_khz: 12.5
    rx:
      freq_mhz: 156.1275
    mode:
      type: "FM"
      notes: >
        ULS Location 1, station class FB2, 40 W. Input 156.1275 (+0.4500 MHz
        split), the only other mobile frequency on the licence. Authorised
        emission 11K2F3E only; no DMR designator on this channel.
  - id: chain_wsmu278_155p610
    station_id: stn_wsmu278
    antenna_id: ant_wsmu278
    tx:
      freq_mhz: 155.610
      emission: "11K2F3E"
      power_w: 60
      bandwidth_khz: 12.5
    mode:
      type: "FM"
      notes: >
        ULS Location 1, station class FB2, 60 W - so this IS a repeater, but the
        input is deliberately not asserted. The licence carries five mobile
        frequencies (153.7475, 153.9650, 154.0775, 154.8300, 155.6100) and none
        of them is an unambiguous paired input, so guessing one would be wrong.
        Needs an RF survey to settle. Authorised emissions 11K2F3E, 4K00F1D,
        4K00F1E.
  - id: chain_kws467_155p025
    station_id: stn_kws467
    antenna_id: ant_kws467
    tx:
      freq_mhz: 155.025
      emission: "11K2F3E"
      power_w: 45
      bandwidth_khz: 12.5
    mode:
      type: "FM"
      notes: >
        ULS Location 2, station class FB (base, not a repeater), 45 W. The only
        mobile frequency on the licence is 155.0250 itself, so this is simplex.
        Broad emission list including 7K60FXD/7K60FXE, so DMR is authorised here,
        but the on-air mode has not been observed - treat FM as the default and
        search for DMR.
  - id: chain_wre645_453p300
    station_id: stn_wre645
    antenna_id: ant_wre645
    tx:
      freq_mhz: 453.300
      emission: "11K2F3E"
      power_w: 100
      bandwidth_khz: 12.5
    rx:
      freq_mhz: 458.300
    mode:
      type: "FM"
      notes: >
        ULS Location 1, station class FB2, 100 W. Input 458.3000 (+5.0000 MHz,
        the standard UHF Part 90 split) and the licence carries exactly that
        mobile frequency. Emissions include 7K60FXD/7K60FXE, so DMR is authorised
        here; on-air mode not observed. Highest-power Michigan City site and the
        most likely to be readable from the lake.
  - id: chain_kar334_154p280
    station_id: stn_kar334
    antenna_id: ant_kar334
    tx:
      freq_mhz: 154.280
      emission: "11K2F3E"
      power_w: 110
      bandwidth_khz: 12.5
    mode:
      type: "FM"
      notes: >
        ULS Location 2, station class FB (base), 110 W. 154.2800 is the national
        fire mutual-aid simplex channel (VFIRE21) - it is not a repeater output
        and must not be modelled as one. Also authorised 16K0F3E (wideband) and
        4K00F1E.
  - id: chain_kar334_154p430
    station_id: stn_kar334
    antenna_id: ant_kar334
    tx:
      freq_mhz: 154.430
      emission: "11K2F3E"
      power_w: 110
      bandwidth_khz: 12.5
    mode:
      type: "FM"
      notes: >
        ULS Location 2, station class FB (base), 110 W, simplex. Also authorised
        16K0F3E (wideband) and 4K00F1E.

