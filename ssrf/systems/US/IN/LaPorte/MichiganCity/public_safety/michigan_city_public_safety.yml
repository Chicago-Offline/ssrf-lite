comments:
  - text: |
      Excluded on purpose: 155.7150.

      RadioReference community reporting lists 155.7150 with DCS 071 as Michigan
      City Police. FCC ULS does not support that. The only licence with a La Porte
      County location on 155.7150 is WNFR297, station class FB2 at 60 W, and it is
      held by the CITY OF LA PORTE - not Michigan City - with licence status E
      (expired) since 2022-08-22.

      Either the RR entry is stale, the attribution is wrong, or the system now
      runs under a call sign that does not file a La Porte County location. Until
      that is resolved, or the frequency is actually heard on air, it stays out of
      the catalog.
  - text: |
      All six systems here are receive-only for anyone who is not the City of
      Michigan City. Two channels (KWS467 155.0250 and WRE645 453.3000) carry DMR
      emission designators and are worth a DMR dwell during any survey; the rest
      are analog-only on the licence.
