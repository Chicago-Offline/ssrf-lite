# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.10.0.schema.json
# SSRF-Lite: City of Michigan City (IN) Public Safety - La Porte County, IN
#
# Six active Part 90 Public Safety licences held by the City of Michigan City,
# authored entirely from FCC ULS. Michigan City sits ~23-27 km NW of the Saugany
# Lake area and is the largest municipal system in La Porte County.
#
# Station class is taken from the licence: FB2 = repeater, FB = base/simplex.
# A repeater input is asserted ONLY where the licence carries a matching mobile
# frequency; where the mobile set is ambiguous the input is left unstated rather
# than guessed.
#
# No CTCSS/DCS tone is recorded in ULS and none has been observed on air, so none
# is asserted here. TX is restricted to the licensee - receive-only for everyone
# else.
#
# NOTE: 155.7150, listed by RadioReference community reporting as Michigan City
# Police, is NOT included. The only La Porte County licence on that frequency is
# WNFR297, which is held by the CITY OF LA PORTE (not Michigan City) and EXPIRED
# on 2022-08-22. See the comments block at the end.

$schema: "../../../../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "FCC ULS weekly bulk dump (HD/EN/LO/FR/EM tables), week of 2026-10-04 - call signs WQNH596, KAR334, KWS467, WSMU278, WPYU546, WRE645"
      url: "https://data.fcc.gov/download/pub/uls/complete/l_LMpriv.zip"
      accessed: "2026-10-10"
    - name: "RadioReference wiki - La Porte County (IN), used only to cross-check which frequencies are in active dispatch use"
      url: "https://wiki.radioreference.com/index.php/La_Porte_County_(IN)"
      accessed: "2026-10-10"

