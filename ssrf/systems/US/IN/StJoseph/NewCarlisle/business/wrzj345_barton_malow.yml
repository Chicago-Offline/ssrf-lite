# SSRF-Lite: Barton Malow Company (WRZJ345) - New Castle, St. Joseph County, IN
#
# Part 90 land mobile licence carrying DMR-capable emission designators, within receive
#   range of the Saugany Lake area (~10.6 km from the lake). Authored from FCC ULS; TX is
#   restricted to the licensee, so these are receive-only entries for everyone else.
#
# Construction/contractor licence tied to the New Carlisle build-out - expect this system to go quiet when the project finishes.
#
# No CTCSS/DCS tone, DMR colour code, time slot or talkgroup is recorded in ULS and
# none has been observed on air, so none is asserted here.

