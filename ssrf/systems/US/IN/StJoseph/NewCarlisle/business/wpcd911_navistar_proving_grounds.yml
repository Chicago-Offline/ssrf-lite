    - name: "FCC ULS License Search - WPCD911 (Navistar Proving Grounds)"
      url: "https://wireless2.fcc.gov/UlsApp/UlsSearch/searchLicense.jsp?searchType=call&callSign=WPCD911"
      accessed: "2026-10-10"
    - name: "FCC ULS weekly bulk dump (HD/EN/LO/FR/EM tables), week of 2026-10-04"
      url: "https://data.fcc.gov/download/pub/uls/complete/l_LMpriv.zip"
      accessed: "2026-10-10"

