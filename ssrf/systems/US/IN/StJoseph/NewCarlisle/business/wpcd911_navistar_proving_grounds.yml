    authority: "FCC"
    service: "business_itinerant_part90"
    class: "Part 90 Business/Industrial"
    identifier: "WPCD911"
    notes: >
      Active FCC licence, IG - Industrial/Business Pool, Conventional. Granted 02/04/2023,
      expires 04/28/2033, current authorisation effective 02/04/2023. FRN 0028825628. ULS
      lists 2 location(s). Mobile operation is authorised within 16.0 km of the fixed site.
      TX is restricted to the licensee; receive-only for everyone else.

rf_chains:
  - id: chain_wpcd911_461p925_1
    station_id: stn_wpcd911
    antenna_id: ant_wpcd911_1
    tx:
      freq_mhz: 461.925
      emission: "7K60FXW"
      power_w: 25
      bandwidth_khz: 12.5
    rx:
      freq_mhz: 466.925
    mode:
      type: "FM"
      notes: >
        ULS Location 1, station class FB2, 25 W output / 79 W ERP. Input 466.925 (+5.0000 MHz
        split), carried on the licence as a mobile/control-station frequency. Authorised
        emissions: 7K60FXW. Includes 7K60FXW, so DMR is authorised here, but the on-air mode
        has not been observed - treat FM as the default and search for DMR.
  - id: chain_wpcd911_462p45_1
    station_id: stn_wpcd911
    antenna_id: ant_wpcd911_1
    tx:
