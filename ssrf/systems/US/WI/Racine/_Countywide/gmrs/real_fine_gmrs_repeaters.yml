# yaml-language-server: $schema=../../../../../../_schema/ssrf-lite-0.5.3.schema.json
$schema: "../../../../../../_schema/ssrf-lite-0.5.3.schema.json"
ssrf_lite_version: "0.5.3"
ssrf_lite:
  sources:
    - name: "Real Fine 650 listing on MyGMRS"
      url: "https://mygmrs.com/user/2WAYRADIOPARTS"
      accessed: "2026-09-10"

organizations:
  - id: org_real_fine_gmrs
    name: "Real Fine GMRS"

locations:
  - id: loc_racine_wi_real_fine
    name: "Racine, WI - Northeast"

stations:
  - id: stn_gmrs_real_fine_650
    call_sign: "GMRS"
    organization_id: org_real_fine_gmrs
    location_id: loc_racine_wi_real_fine
    service: "gmrs"

rf_chains:
  - id: chain_gmrs_real_fine_650
    station_id: stn_gmrs_real_fine_650
    tx:
      freq_mhz: 467.650
      emission: "20K0F3E"
      bandwidth_khz: 25
    rx:
      freq_mhz: 462.650
    mode:
      type: "FM"
      ctcss_tx_hz: 77.0
      ctcss_rx_hz: 77.0

assignments:
  - id: asgn_gmrs_real_fine_650
    rf_chain_id: chain_gmrs_real_fine_650
    usage: "repeater"
    notes: "Open system; free to use for all GMRS traffic types. 77.0 Hz PL on input and output. Coverage includes Racine, Kenosha, and southern Milwaukee County areas."
