      ctcss_tx_hz: 156.7
      ctcss_rx_hz: 156.7
    channels:
      - name: "VCALL10"
        freq_mhz: 155.7525
        emission: "11K0F3E"
        notes: "Nationwide VHF calling channel."
      - name: "VTAC11"
        freq_mhz: 151.1375
        emission: "11K0F3E"
        notes: "Not for use in PR/USVI."
      - name: "VTAC12"
        freq_mhz: 154.4525
        emission: "11K0F3E"
        notes: "Not for use in PR/USVI."
      - name: "VTAC13"
