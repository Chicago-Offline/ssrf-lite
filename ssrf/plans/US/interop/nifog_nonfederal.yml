        emission: "11K0F3E"
      - name: "VTAC33"
        freq_mhz: 159.4725
        rx_freq_mhz: 151.1375
        emission: "11K0F3E"
        mode: { type: "FM", ctcss_tx_hz: 156.7, ctcss_rx_hz: 136.5 }
        notes: "Tactical repeater. Reverse of VTAC36. Not for use in PR/USVI."
      - name: "VTAC34"
        freq_mhz: 158.7375
