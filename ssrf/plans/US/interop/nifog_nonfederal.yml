      - name: "UTAC41D"
        freq_mhz: 453.4625
        emission: "11K0F3E"
        notes: "Direct/simplex."
      - name: "UTAC42"
        freq_mhz: 458.7125
        rx_freq_mhz: 453.7125
        emission: "11K0F3E"
        notes: "Repeater. Mobile TX 458.7125 (input) / mobile RX 453.7125 (output)."
      - name: "UTAC42D"
        freq_mhz: 453.7125
        emission: "11K0F3E"
        notes: "Direct/simplex."
      - name: "UTAC43"
        freq_mhz: 458.8625
