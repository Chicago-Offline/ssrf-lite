# yaml-language-server: $schema=../../../_schema/ssrf-lite-0.9.0.schema.json
# SSRF-Lite: NOAA Weather Radio (WX1–WX7)
# Notes: RX-only, FM (wide). Kept as a separate zone for quick access.
# Sources: NOAA Weather Radio channel plan.

$schema: "../../../_schema/ssrf-lite-0.9.0.schema.json"
ssrf_lite_version: "0.9.0"
organizations:
  - id: org_noaa
    name: "NOAA Weather Radio"

locations:
  - id: loc_chi
    name: "Chicago Metro"
    lat: 41.8781
    lon: -87.6298

stations:
  - id: stn_noaa
    call_sign: null
    organization_id: org_noaa
    location_id: loc_chi
    service: "noaa_weather_radio"

antennas:
  - id: ant_noaa
    station_id: stn_noaa
    name: "Portable"
    gain_dbi: null
    height_agl_m: null
    height_amsl_m: null

rf_chains:
  # WX1–WX7. Use 16K0F3E to hint wide FM in bandwidth mapping.
  - {
      id: chain_wx1,
      station_id: stn_noaa,
      antenna_id: ant_noaa,
      tx: { freq_mhz: 162.550, emission: "16K0F3E" },
      mode: { type: "FM" },
    }
  - {
      id: chain_wx2,
      station_id: stn_noaa,
      antenna_id: ant_noaa,
      tx: { freq_mhz: 162.400, emission: "16K0F3E" },
      mode: { type: "FM" },
    }
  - {
      id: chain_wx3,
      station_id: stn_noaa,
      antenna_id: ant_noaa,
      tx: { freq_mhz: 162.475, emission: "16K0F3E" },
      mode: { type: "FM" },
    }
  - {
      id: chain_wx4,
      station_id: stn_noaa,
      antenna_id: ant_noaa,
      tx: { freq_mhz: 162.425, emission: "16K0F3E" },
      mode: { type: "FM" },
    }
  - {
      id: chain_wx5,
      station_id: stn_noaa,
      antenna_id: ant_noaa,
      tx: { freq_mhz: 162.450, emission: "16K0F3E" },
      mode: { type: "FM" },
    }
  - {
      id: chain_wx6,
      station_id: stn_noaa,
      antenna_id: ant_noaa,
      tx: { freq_mhz: 162.500, emission: "16K0F3E" },
      mode: { type: "FM" },
    }
  - {
      id: chain_wx7,
      station_id: stn_noaa,
      antenna_id: ant_noaa,
      tx: { freq_mhz: 162.525, emission: "16K0F3E" },
      mode: { type: "FM" },
    }

assignments:
  - id: asg_wx1
    channel_name: "WX 1"
    rf_chain_id: chain_wx1
    usage: "simplex"
  - id: asg_wx2
    channel_name: "WX 2"
    rf_chain_id: chain_wx2
    usage: "simplex"
  - id: asg_wx3
    channel_name: "WX 3"
    rf_chain_id: chain_wx3
    usage: "simplex"
  - id: asg_wx4
    channel_name: "WX 4"
    rf_chain_id: chain_wx4
    usage: "simplex"
  - id: asg_wx5
    channel_name: "WX 5"
    rf_chain_id: chain_wx5
    usage: "simplex"
  - id: asg_wx6
    channel_name: "WX 6"
    rf_chain_id: chain_wx6
    usage: "simplex"
  - id: asg_wx7
    channel_name: "WX 7"
    rf_chain_id: chain_wx7
    usage: "simplex"

comments:
  - text: |
      NOAA Weather Radio broadcast channels. Wide-FM. RX-only for OpenGD77 scanning.
