$schema: "../../../_schema/ssrf-lite-0.10.0.schema.json"
ssrf_lite_version: "0.10.0"
ssrf_lite:
  sources:
    - name: "47 CFR Part 95 Subpart D - Citizens Band Radio Service (CBRS)"
      url: "https://www.ecfr.gov/current/title-47/chapter-I/subchapter-D/part-95/subpart-D"
      accessed: "2026-09-29"
    - name: "47 CFR 95.963 - CBRS channel frequencies"
      url: "https://www.ecfr.gov/current/title-47/section-95.963"
      accessed: "2026-09-29"

organizations:
  - id: org_fcc
    name: "Federal Communications Commission (FCC)"

authorizations:
  - id: auth_fcc_cb
    authority: "FCC"
    service: "cb"
    class: "Licensed by rule"
    identifier:
    notes: |
      No individual license required under 47 CFR Part 95, Subpart D (95.305).
      Power (95.967): AM (A3E) and FM (F3E) mean carrier power <= 4 W; SSB
      (J3E/R3E/H3E) peak envelope power <= 12 W.
      Emissions (95.971): A3E or SSB required; F3E permitted since the 2021
      amendment (86 FR 53565). SSB sets must offer USB and may add LSB.
      Bandwidth (95.973): 8 kHz for A3E/F3E, 4 kHz for J3E/R3E/H3E. All four
      permitted emissions are carried on the channel plan's `emissions` block
      and apply to every channel.
      Channel 9 is restricted to emergency and traveler assistance (95.931(a)(2)).
      External RF power amplifiers are prohibited outright (95.939).
      Antenna height (95.941): <= 18.3 m (60 ft) AGL, or 6.1 m (20 ft) above the
      building or tree it is mounted on, whichever is higher.
      No repeaters. No international contacts except Canadian General Radio
      Service stations (95.933(d)).

channel_plans:
  - id: chplan_us_cb
    name: "US CB (Citizens Band)"
    service: "cb"
    emissions:
      # 95.971 permits A3E or SSB on every channel; F3E was added by the 2021
      # amendment (86 FR 53565). Bandwidth per 95.973, power per 95.967.
      - emission: "8K00A3E"
        mode: "AM"
        bandwidth_khz: 8
        power_w: 4
      - emission: "4K00J3E"
        mode: "USB"
        bandwidth_khz: 4
        power_w: 12
        notes: "SSB sets must offer USB (95.971)."
      - emission: "4K00J3E"
        mode: "LSB"
        bandwidth_khz: 4
        power_w: 12
        notes: "SSB sets may add LSB (95.971)."
      - emission: "8K00F3E"
        mode: "FM"
        bandwidth_khz: 8
        power_w: 4
    channels:
      - name: "CB 01"
        freq_mhz: 26.9650
      - name: "CB 02"
        freq_mhz: 26.9750
