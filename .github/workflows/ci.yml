name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Validate schema and YAML headers
        run: |
          uv run python generate_ssrf_schema.py --check
          uv run python stamp_ssrf_headers.py --check

      - name: Run tests
        run: uv run python -m pytest tests/

      - name: Build site data (smoke test)
        run: |
          uv run python generate_ssrf_docs.py --output-dir site/docs/ssrf
          uv run python generate_ssrf_site.py
          uv run python generate_ssrf_codeplug.py
